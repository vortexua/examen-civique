<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171930" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Civique">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Prépa Examen Civique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,700;1,500&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: a civic workbook. Top bar with five sections, one centered column (max 880px), official numbering on every question. */
:root{
  --bg:#f6f7fb; --surface:#ffffff; --sunk:#eceef6; --line:#d8dbe8;
  --fg:#16182b; --muted:#5a5f78;
  --bleu:#000091; --bleu-soft:#e3e3fd; --rouge:#c9191e; --rouge-soft:#fde4e4;
  --ok:#18753c; --ok-soft:#dcf2e3; --warn:#9a5b00; --warn-soft:#fdf0d6;
  --font-display:"Spectral", Georgia, "Times New Roman", serif;
  --font-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e0f1c; --surface:#171930; --sunk:#11132a; --line:#2c2f4d;
  --fg:#eceef8; --muted:#a2a6c4;
  --bleu:#9a9aff; --bleu-soft:#24265a; --rouge:#ff7a7f; --rouge-soft:#45191f;
  --ok:#5fd38a; --ok-soft:#173523; --warn:#f1b55a; --warn-soft:#3a2a10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0f1c; --surface:#171930; --sunk:#11132a; --line:#2c2f4d;
  --fg:#eceef8; --muted:#a2a6c4;
  --bleu:#9a9aff; --bleu-soft:#24265a; --rouge:#ff7a7f; --rouge-soft:#45191f;
  --ok:#5fd38a; --ok-soft:#173523; --warn:#f1b55a; --warn-soft:#3a2a10; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.tricolor{height:4px;background:linear-gradient(90deg,var(--bleu) 0 33.3%,var(--surface) 33.3% 66.6%,var(--rouge) 66.6%)}
.topin{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.15rem;letter-spacing:.01em;color:var(--fg);text-decoration:none;white-space:nowrap}
.brand small{font-family:var(--font-mono);font-weight:400;font-size:.7rem;color:var(--muted);margin-left:6px;letter-spacing:.06em}
nav.tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;max-width:100%}
nav.tabs a{padding:6px 10px;border-radius:6px;text-decoration:none;color:var(--muted);font-weight:700;font-size:.92rem;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--bleu);background:var(--bleu-soft)}
nav.tabs a:hover{color:var(--fg)}
main{padding-block:28px 64px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:2rem}h2{font-size:1.45rem}h3{font-size:1.1rem}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.lead{color:var(--muted);max-width:62ch}
.eyebrow{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.btn{font:inherit;font-weight:700;border-radius:8px;padding:10px 18px;border:1px solid var(--bleu);background:var(--bleu);color:var(--surface);cursor:pointer}
.btn.ghost{background:transparent;color:var(--bleu)}
.btn.small{padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,a:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--rouge);outline-offset:2px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
/* format strip */
.format{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.format div{padding:14px 16px;border-right:1px solid var(--line)}
.format div:last-child{border-right:0}
.format b{display:block;font-family:var(--font-mono);font-size:1.5rem;color:var(--bleu)}
.format span{font-size:.85rem;color:var(--muted)}
@media (max-width:560px){.format{grid-template-columns:repeat(2,1fr)}.format div:nth-child(2){border-right:0}.format div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
/* readiness */
.ready{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.gauge{font-family:var(--font-display);font-size:3.2rem;font-weight:700;color:var(--bleu);line-height:1}
.themebars{display:flex;flex-direction:column;gap:10px}
.tb{display:grid;grid-template-columns:minmax(0,1fr) 120px 52px;gap:12px;align-items:center;font-size:.92rem}
.tb .bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;display:flex}
.tb .bar i{display:block;height:100%}
.tb .bar i.m{background:var(--ok)}.tb .bar i.l{background:var(--warn)}
@media (max-width:480px){.tb{grid-template-columns:1fr 70px 44px}}
/* question */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}
.qmeta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.06em;padding:3px 8px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.tag.sit{background:var(--rouge-soft);color:var(--rouge)}
.tag.ext{background:var(--warn-soft);color:var(--warn)}
.tag.src{background:var(--bleu-soft);color:var(--bleu)}
.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:70ch}
.qtext{font-family:var(--font-display);font-size:1.3rem;font-weight:500;margin-bottom:18px;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;width:100%}
.opt:hover:not(:disabled){border-color:var(--bleu)}
.opt .k{font-family:var(--font-mono);font-weight:600;color:var(--muted);min-width:1.2em}
.opt.sel{border-color:var(--bleu);background:var(--bleu-soft)}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--rouge);background:var(--rouge-soft)}
.opt:disabled{cursor:default}
.expl{margin-top:16px;padding:14px 16px;border-left:3px solid var(--bleu);background:var(--sunk);border-radius:0 8px 8px 0}
.expl b{color:var(--bleu)}
/* exam */
.examhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.timer{font-family:var(--font-mono);font-size:1.4rem;font-weight:600;padding:4px 12px;border-radius:6px;background:var(--sunk)}
.timer.low{color:var(--rouge);background:var(--rouge-soft)}
.qnav{display:grid;grid-template-columns:repeat(20,1fr);gap:4px}
@media (max-width:640px){.qnav{grid-template-columns:repeat(10,1fr)}}
.qnav button{font-family:var(--font-mono);font-size:.75rem;padding:6px 0;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.qnav button.ans{background:var(--bleu-soft);color:var(--bleu);border-color:transparent}
.qnav button.cur{outline:2px solid var(--bleu)}
.qnav button.good{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.qnav button.bad{background:var(--rouge-soft);color:var(--rouge);border-color:transparent}
/* result = attestation */
.attest{border:1.5px solid var(--fg);border-radius:4px;padding:28px;background:var(--surface);position:relative}
.attest .seal{position:absolute;right:20px;top:20px;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;text-align:center;font-family:var(--font-mono);font-size:.68rem;font-weight:600;letter-spacing:.08em;transform:rotate(-8deg);border:2px solid currentColor}
.attest .seal.ok{color:var(--ok)}.attest .seal.ko{color:var(--rouge)}
.score{font-family:var(--font-display);font-size:3.4rem;font-weight:700;line-height:1}
.score small{font-size:1.4rem;color:var(--muted)}
@media (max-width:480px){.attest .seal{position:static;margin-bottom:12px}}
table.sum{width:100%;border-collapse:collapse;font-size:.93rem}
table.sum td,table.sum th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
table.sum th,table.sum th.r{font-family:var(--font-body);font-size:.85rem;color:var(--muted);font-weight:700}
.tablebox{overflow-x:auto;max-width:100%}
.fbody,.panel,.attest{min-width:0}
.chrono{table-layout:auto}
table.sum td.r,table.sum th.r{text-align:right;font-family:var(--font-mono)}
/* fiches */
.fichelist{display:flex;flex-direction:column;gap:10px}
details.fiche{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.fiche summary{cursor:pointer;padding:14px 18px;font-weight:700;display:flex;justify-content:space-between;gap:12px;align-items:center;list-style:none}
details.fiche summary::-webkit-details-marker{display:none}
details.fiche summary::after{content:"+";font-family:var(--font-mono);color:var(--muted)}
details.fiche[open] summary::after{content:"−"}
.fbody{padding:0 18px 18px;max-width:72ch}
.fbody ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.fbody p{margin-bottom:8px}
.chrono{border-collapse:collapse;width:100%}
.chrono td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.chrono td:first-child{font-family:var(--font-mono);font-weight:600;color:var(--bleu);white-space:nowrap}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{font:inherit;font-size:.9rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--bleu);border-color:var(--bleu);color:var(--surface)}
.done-chip{font-family:var(--font-mono);font-size:.7rem;color:var(--ok)}
/* heatmap */
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(22px,1fr));gap:3px}
.heat button{aspect-ratio:1;max-width:100%;border:0;border-radius:3px;background:var(--sunk);cursor:pointer;padding:0;font-family:var(--font-mono);font-size:.55rem;color:transparent}
.heat button:hover{color:var(--fg)}
.heat button.l{background:var(--warn)}.heat button.m{background:var(--ok)}.heat button.w{background:var(--rouge)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.chartbox{overflow-x:auto}
.chartbox svg{display:block;width:100%;min-width:320px;height:auto}
.note{font-size:.85rem;color:var(--muted)}
.syncline{font-size:.78rem;color:var(--muted);font-family:var(--font-mono)}
.flipcard{display:flex;flex-direction:column;gap:14px;align-items:flex-start;text-align:left;font:inherit;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:24px;min-height:220px;cursor:pointer;width:100%}
.flipcard.on{border-color:var(--bleu)}
.flipcard .fq{font-family:var(--font-display);font-size:1.3rem;font-weight:500}
.flipcard .fa{padding:12px 14px;border-left:3px solid var(--bleu);background:var(--sunk);border-radius:0 8px 8px 0;max-width:68ch}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
@media (prefers-reduced-motion:no-preference){.opt{transition:border-color .12s,background .12s}}
/* phone layout (iPhone 16: 393 x 852 pt) */
html{-webkit-text-size-adjust:100%}
button,a,.opt,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.tabbar{display:none}
@media (max-width:700px){
  nav.tabs{display:none}
  .topin{padding-block:8px}
  .brand{font-size:1.05rem}
  h1{font-size:1.6rem} h2{font-size:1.3rem}
  main{padding-block:20px calc(88px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
    padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:50px;font-size:.66rem;font-weight:700;color:var(--muted);text-decoration:none;border-radius:10px}
  .tabbar a[aria-current="page"]{color:var(--bleu);background:var(--bleu-soft)}
  .tabbar svg{width:22px;height:22px}
  .panel{padding:16px}
  .qcard{padding:18px} .qtext{font-size:1.18rem;margin-bottom:14px}
  .opt{min-height:52px;padding:12px}
  .seg button{min-height:40px;padding:8px 14px}
  .btn{min-height:46px} .btn.small{min-height:42px}
  .qnav{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;padding-block:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .qnav::-webkit-scrollbar{display:none}
  .qnav button{flex:0 0 42px;min-height:42px;font-size:.85rem;scroll-snap-align:center}
  .examhead{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,49px));z-index:4;background:var(--bg);padding-block:8px;flex-wrap:nowrap;box-shadow:0 1px 0 var(--line)}
  .examhead .eyebrow{letter-spacing:.06em}
  .timer{font-size:1.15rem;flex:0 0 auto}
  .heat{grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:4px}
  .tb{grid-template-columns:minmax(0,1fr) 72px 44px;gap:10px}
  .attest{padding:20px} .score{font-size:2.8rem}
  .flipcard{min-height:260px;padding:20px}
  .gauge{font-size:2.8rem}
  details.fiche summary{min-height:48px}
}
</style>
</head>
<body>


<header class="top">
  <div class="tricolor"></div>
  <div class="wrap topin">
    <a class="brand" href="#accueil">Prépa Examen Civique<small>NAT · 2026</small></a>
    <nav class="tabs" aria-label="Sections">
      <a href="#accueil">Accueil</a>
      <a href="#examen">Examen blanc</a>
      <a href="#entrainement">Entraînement</a>
      <a href="#fiches">Fiches</a>
      <a href="#entretien">Entretien</a>
      <a href="#progres">Progrès</a>
    </nav>
  </div>
</header>
<nav class="tabbar" aria-label="Sections"><a href="#accueil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span>Accueil</span></a><a href="#examen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M9 2h6"/></svg><span>Examen</span></a><a href="#entrainement"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/><path d="M17 16l2 2 3-4"/></svg><span>Entraîner</span></a><a href="#fiches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></svg><span>Fiches</span></a><a href="#entretien"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h8"/></svg><span>Entretien</span></a><a href="#progres"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Progrès</span></a></nav>
<main class="wrap" id="view"></main>

<script>
// [num, theme, question, [correct, d1, d2, d3], explanation]
// Themes: P Principes et valeurs · I Institutions · D Droits et devoirs · H Histoire, géographie, culture · V Vivre en société
const Q = [
[1,"P","Complétez les paroles de la Marseillaise : « Allons enfants de la patrie… »",["Le jour de gloire est arrivé","Liberté, égalité, fraternité","Aux armes, citoyens, la France est là","Que vive à jamais la République"],"Premier couplet de la Marseillaise (Rouget de Lisle, 1792) : « Allons enfants de la Patrie, le jour de gloire est arrivé ! »"],
[2,"P","Dans le cadre d'un entretien d'embauche, que peut-on demander au candidat ?",["Son expérience et ses compétences professionnelles","Sa religion","S'il a l'intention d'avoir des enfants","Ses opinions politiques"],"Le recruteur ne peut poser que des questions liées au poste. Interroger sur la religion, la grossesse ou les opinions est discriminatoire."],
[3,"P","Déclarer ses revenus aux services fiscaux est :",["Une obligation pour tous les foyers fiscaux","Facultatif","Réservé aux personnes qui gagnent beaucoup","Obligatoire seulement pour les Français"],"Chaque foyer doit déclarer ses revenus chaque année, même s'il n'est pas imposable."],
[4,"P","En France, les impôts permettent de financer les dépenses publiques. Quelle proposition est correcte ?",["Ils financent notamment l'école, la police, la justice et les routes","Ils servent uniquement à payer le salaire du Président","Ils sont versés aux entreprises privées","Ils ne sont payés que par les étrangers"],"L'impôt finance les services publics. Chacun y contribue selon ses moyens (article 13 de la DDHC)."],
[5,"P","La liberté d'association est :",["Une liberté fondamentale garantie par la loi de 1901","Une liberté réservée aux Français","Interdite depuis 1905","Soumise à l'autorisation du maire"],"La loi du 1er juillet 1901 permet à toute personne de créer une association librement, par simple déclaration en préfecture."],
[6,"P","La liberté d'expression sur les réseaux sociaux en France est :",["Garantie mais encadrée par la loi (pas d'injure, de diffamation ni d'appel à la haine)","Totale : on peut tout écrire","Interdite","Réservée aux journalistes"],"Les mêmes règles s'appliquent en ligne et hors ligne : la diffamation, l'injure et la provocation à la haine sont punies."],
[7,"P","Lequel de ces prénoms évoque un symbole de la République ?",["Marianne","Jeanne","Louise","Joséphine"],"Marianne est la figure allégorique de la République française."],
[8,"P","Lequel de ces symboles représente la République française ?",["Le drapeau bleu, blanc, rouge","La fleur de lys","L'aigle impérial","La couronne"],"Le drapeau tricolore est l'emblème national (article 2 de la Constitution). La fleur de lys et la couronne évoquent la monarchie."],
[9,"P","Où peut-on voir la devise de la République ?",["Sur le fronton des mairies et des écoles publiques","Uniquement à l'Élysée","Sur les églises","Sur les billets de banque étrangers"],"« Liberté, Égalité, Fraternité » figure sur les bâtiments publics, les pièces de monnaie et les documents officiels."],
[10,"P","Lesquels sont des symboles officiels de la République française ?",["Le drapeau tricolore, la Marseillaise, la devise et le 14 juillet","La tour Eiffel et la baguette","Le château de Versailles et la couronne","Le béret et le vin"],"L'article 2 de la Constitution cite l'emblème, l'hymne, la devise ; le 14 juillet est la fête nationale. Marianne est aussi un symbole."],
[11,"P","Peut-on brûler publiquement un drapeau français ?",["Non, l'outrage au drapeau est puni par la loi","Oui, c'est la liberté d'expression","Oui, si on est français","Seulement le 14 juillet"],"Outrager publiquement le drapeau tricolore est une infraction pénale."],
[12,"P","Quand la sécurité sociale a-t-elle été établie en France ?",["En 1945","En 1789","En 1905","En 1981"],"Les ordonnances d'octobre 1945, issues du programme du Conseil national de la Résistance, créent la Sécurité sociale."],
[13,"P","Que commémore la fête nationale ?",["La prise de la Bastille (14 juillet 1789) et la fête de la Fédération (1790)","La fin de la Seconde Guerre mondiale","La naissance de Napoléon","L'armistice de 1918"],"Le 14 juillet est fête nationale depuis 1880."],
[14,"P","Que porte Marianne sur la tête ?",["Un bonnet phrygien","Une couronne","Un casque","Un chapeau haut de forme"],"Le bonnet phrygien, porté par les révolutionnaires, symbolise la liberté."],
[15,"P","Que signifie le mot « fraternité » dans la devise française ?",["La solidarité et l'entraide entre tous les citoyens","Avoir des frères et sœurs","L'égalité des salaires","La liberté de religion"],"La fraternité exprime le lien de solidarité qui unit les membres de la nation."],
[16,"P","Quel symbole de la République peut-on voir sur les maillots de l'équipe de France de football ?",["Le coq","Le lion","L'aigle","L'ours"],"Le coq gaulois est un emblème traditionnel de la France, utilisé notamment par les équipes sportives."],
[17,"P","Quelle est la devise de la République française ?",["Liberté, Égalité, Fraternité","Travail, Famille, Patrie","Unie dans la diversité","Honneur et Patrie"],"Inscrite à l'article 2 de la Constitution. « Travail, Famille, Patrie » était la devise du régime de Vichy."],
[18,"P","Qu'est-ce que la liberté d'association ?",["Le droit de se regrouper librement pour un projet commun, sans but lucratif","L'obligation d'adhérer à un syndicat","Le droit de créer une entreprise","Le droit de manifester"],"Loi de 1901 : une association réunit des personnes autour d'un projet sans partage des bénéfices."],
[19,"P","Qu'est-ce qu'une liberté ?",["La possibilité d'agir sans contrainte, dans les limites fixées par la loi","Le droit de faire tout ce que l'on veut","Une obligation imposée par l'État","Un privilège réservé aux citoyens"],"La liberté consiste à pouvoir faire tout ce qui ne nuit pas à autrui (DDHC, art. 4)."],
[20,"P","Selon la Constitution, la France est une République…",["Indivisible, laïque, démocratique et sociale","Fédérale, religieuse et libérale","Monarchique et constitutionnelle","Impériale et centralisée"],"Article 1er de la Constitution de 1958."],
[21,"P","Sur quel document peut-on voir Marianne ?",["Sur les timbres-poste","Sur le passeport américain","Sur la carte Vitale uniquement","Sur les billets en dollars"],"Marianne figure sur les timbres, les pièces de 1, 2 et 5 centimes et le logo officiel de l'État."],
[22,"P","Une des valeurs de la devise républicaine est l'Égalité. Qu'est-ce que cela signifie ?",["Tous les citoyens ont les mêmes droits et les mêmes devoirs devant la loi","Tout le monde gagne le même salaire","Tout le monde a la même religion","Les hommes ont plus de droits que les femmes"],"L'égalité devant la loi s'applique sans distinction d'origine, de sexe, de religion (Constitution, art. 1)."],
[23,"P","Une personne peut-elle changer librement de religion en France ?",["Oui, la liberté de conscience le permet","Non, c'est interdit","Seulement avec l'accord de sa famille","Seulement avec l'accord du maire"],"La liberté de conscience inclut le droit de croire, de ne pas croire et de changer de religion."],
[24,"P","Selon le principe de laïcité, que signifie la neutralité de l'État ?",["L'État ne favorise ni ne défavorise aucune religion","L'État interdit les religions","L'État choisit une religion officielle","L'État finance toutes les religions"],"L'État est neutre : il traite toutes les croyances de la même manière."],
[25,"P","Que peut faire un usager du service public dans une mairie ?",["Porter un signe religieux, en respectant les règles du service","Exiger d'être reçu par un agent de sa religion","Refuser d'être reçu par une femme","Faire du prosélytisme religieux auprès des agents"],"L'usager n'est pas soumis à la neutralité : il peut porter un signe religieux, faire ses démarches (état civil, papiers, listes électorales), se marier. Il ne peut pas choisir son agent selon le sexe ou la religion."],
[26,"P","En France, il est possible pour l'État de financer :",["L'entretien des édifices religieux construits avant 1905 qui lui appartiennent","Le salaire des prêtres et des imams","La construction de nouvelles mosquées ou églises","Les activités religieuses"],"Depuis 1905, l'État ne subventionne aucun culte, mais les édifices antérieurs à 1905 sont propriété publique et entretenus par l'État ou les communes."],
[27,"P","En quelle année la loi de séparation des Églises et de l'État a-t-elle été votée ?",["1905","1789","1848","1958"],"Loi du 9 décembre 1905."],
[28,"P","Que dit la loi de 1905 ?",["La République assure la liberté de conscience et ne reconnaît, ne salarie ni ne subventionne aucun culte","La religion catholique est religion d'État","Les religions sont interdites","Chaque citoyen doit déclarer sa religion"],"Articles 1 et 2 de la loi du 9 décembre 1905."],
[29,"P","Que garantit le principe de laïcité ?",["La liberté de croire ou de ne pas croire et la neutralité de l'État","L'interdiction de toute pratique religieuse","L'obligation de pratiquer une religion","La supériorité d'une religion"],"La laïcité protège la liberté de conscience et l'égalité de tous, quelles que soient leurs convictions."],
[30,"P","Quel jour célèbre-t-on officiellement la laïcité en France ?",["Le 9 décembre","Le 14 juillet","Le 1er mai","Le 11 novembre"],"Date anniversaire de la loi du 9 décembre 1905."],
[31,"P","Quel symbole religieux peut être porté dans une école publique dans le respect de la laïcité ?",["Un signe discret, comme une petite médaille ou une petite croix","Un voile islamique","Une kippa","Une grande croix"],"La loi du 15 mars 2004 interdit aux élèves les signes religieux ostensibles ; les signes discrets sont admis."],
[32,"P","Quel terme désigne précisément la haine ou les préjugés contre les Juifs ?",["L'antisémitisme","La xénophobie","L'homophobie","Le sexisme"],"L'antisémitisme est puni par la loi, comme toute forme de racisme."],
[33,"P","Quel texte est considéré comme le texte fondateur de la laïcité ?",["La loi de séparation des Églises et de l'État de 1905","Le Code civil de 1804","La Déclaration de 1789","Le traité de Rome"],"La loi de 1905 organise la séparation des cultes et de l'État."],
[34,"P","Quelle institution française doit rester neutre en matière de religion ?",["L'école publique","Une association religieuse","Une famille","Un lieu de culte"],"L'école publique, comme tous les services publics, est neutre."],
[35,"P","Qu'est-ce que la laïcité ?",["La séparation de l'État et des religions, la neutralité de l'État et la liberté de conscience","Le rejet de toutes les religions","Une religion officielle","L'obligation de cacher sa foi partout"],"La laïcité n'est pas contre les religions : elle garantit leur libre exercice dans le respect de l'ordre public."],
[36,"P","À l'école, la charte de la laïcité permet de :",["Rappeler les règles de la laïcité aux élèves, parents et personnels","Interdire aux élèves d'avoir une religion","Choisir les enseignants selon leur religion","Organiser des cours de religion"],"Affichée depuis 2013 dans les écoles, elle explique les principes de la laïcité."],
[37,"P","Qui doit respecter et veiller à la neutralité religieuse dans les services publics ?",["Les agents publics (fonctionnaires et agents)","Les usagers","Les ministres du culte","Les touristes"],"Les agents publics sont soumis à une stricte obligation de neutralité ; les usagers restent libres de manifester leurs convictions dans les limites de l'ordre public."],
[38,"P","Une personne déclare ne croire en aucun dieu. On peut dire :",["Qu'elle est athée","Qu'elle est laïque","Qu'elle est croyante","Qu'elle est protestante"],"Être athée, c'est ne croire en aucun dieu. Être agnostique, c'est penser qu'on ne peut pas savoir."],
[39,"I","Comment est désigné le Premier ministre ?",["Il est nommé par le Président de la République","Il est élu par les citoyens","Il est élu par le Sénat","Il est désigné par le Conseil constitutionnel"],"Article 8 de la Constitution."],
[40,"I","Qui peut se présenter aux élections présidentielles ?",["Un citoyen français majeur qui a recueilli 500 parrainages d'élus","Tout résident en France","Uniquement les anciens ministres","Tout citoyen européen"],"Il faut être Français, avoir au moins 18 ans, jouir de ses droits civiques et réunir 500 signatures d'élus."],
[41,"I","À qui appartient la souveraineté nationale ?",["Au peuple, qui l'exerce par ses représentants et par le référendum","Au Président de la République","Au Parlement européen","Au Premier ministre"],"Article 3 de la Constitution."],
[42,"I","Qui est élu lors des élections municipales ?",["Les conseillers municipaux","Les députés","Le préfet","Les sénateurs"],"Les électeurs élisent le conseil municipal, qui élit ensuite le maire."],
[43,"I","L'inscription sur les listes électorales est :",["Obligatoire","Interdite aux jeunes","Payante","Réservée aux propriétaires"],"Le Code électoral la rend obligatoire ; elle est automatique à 18 ans pour les jeunes recensés."],
[44,"I","Quelle condition est nécessaire pour voter aux élections présidentielles ?",["Être de nationalité française, majeur et inscrit sur les listes électorales","Habiter en France depuis 5 ans","Payer des impôts","Être propriétaire"],"Seuls les Français majeurs jouissant de leurs droits civiques votent à la présidentielle."],
[45,"I","Quelle condition faut-il remplir pour être candidat aux élections municipales ?",["Avoir au moins 18 ans et être électeur ou contribuable de la commune","Avoir au moins 40 ans","Être fonctionnaire","Être né dans la commune"],"Les citoyens de l'Union européenne peuvent aussi être conseillers municipaux, mais pas maire."],
[46,"I","Parmi ces autorités, laquelle est élue ?",["Le maire","Le préfet","Le recteur d'académie","Le commissaire de police"],"Le maire est élu par le conseil municipal ; le préfet est nommé par le gouvernement."],
[47,"I","Quelles sont les fonctions du maire ?",["Il gère la commune, célèbre les mariages et tient l'état civil","Il vote les lois","Il juge les délits","Il commande l'armée"],"Le maire est à la fois chef de l'administration communale et agent de l'État (état civil, police municipale)."],
[48,"I","Les citoyens de l'Union européenne peuvent-ils voter aux élections locales dans un autre État de l'Union ?",["Oui, aux élections municipales (et européennes) de leur pays de résidence","Non, jamais","Oui, mais seulement à l'élection présidentielle","Oui, à condition de renoncer à leur nationalité"],"Droit créé par le traité de Maastricht (1992). En France, ils s'inscrivent sur les listes complémentaires ; ils peuvent être conseillers municipaux mais pas maire ni adjoint."],
[49,"I","Une personne n'ayant pas accès à internet veut s'inscrire sur les listes électorales. Où peut-elle s'inscrire ?",["À la mairie de sa commune","À la préfecture de région","Au tribunal","À la poste"],"L'inscription se fait en ligne ou en mairie, avec une pièce d'identité et un justificatif de domicile."],
[50,"I","À quel âge peut-on devenir électeur ?",["18 ans","16 ans","21 ans","25 ans"],"Le droit de vote s'acquiert à la majorité, 18 ans depuis 1974."],
[51,"I","En France, est-ce obligatoire de voter ?",["Non, voter est un droit et un devoir civique, mais n'est pas obligatoire","Oui, sous peine d'amende","Oui, pour les élections présidentielles","Oui, pour les fonctionnaires"],"Le vote n'est pas obligatoire en France (contrairement à la Belgique)."],
[52,"I","A-t-on le droit de ne pas respecter une loi ?",["Non, la loi s'impose à tous","Oui, si on n'est pas d'accord","Oui, si on est étranger","Oui, si on est élu"],"Nul n'est au-dessus de la loi. On peut la contester par des voies légales (pétition, vote, recours)."],
[53,"I","Comment sont désignés les députés ?",["Ils sont élus au suffrage universel direct par les citoyens","Ils sont nommés par le Président","Ils sont élus par les maires","Ils sont tirés au sort"],"Les 577 députés sont élus lors des élections législatives."],
[54,"I","Qui vote les lois ?",["Le Parlement (Assemblée nationale et Sénat)","Le Président de la République","Le Conseil constitutionnel","Les préfets"],"Article 24 de la Constitution : le Parlement vote la loi et contrôle le gouvernement."],
[55,"I","La séparation des pouvoirs est un principe fondamental. Quels sont les trois pouvoirs concernés ?",["Législatif, exécutif et judiciaire","Militaire, religieux et civil","Municipal, régional et national","Économique, social et culturel"],"Théorisée par Montesquieu : faire, appliquer et juger la loi sont confiés à des autorités distinctes."],
[56,"I","Qu'est-ce que l'État de droit ?",["Un État où chacun, y compris l'État lui-même, doit respecter la loi","Un État dirigé par des juges","Un État sans lois","Un État où le chef décide seul"],"Les autorités publiques sont soumises au droit et contrôlées par des juges indépendants."],
[57,"I","Quelles sont les durées du mandat du conseil municipal et du maire ?",["6 ans","5 ans","4 ans","7 ans"],"Les conseillers municipaux et le maire sont élus pour 6 ans."],
[58,"I","Qui est élu lors des élections législatives ?",["Les députés","Les sénateurs","Les maires","Le Président"],"Les législatives désignent les 577 membres de l'Assemblée nationale."],
[59,"I","Quelle est la durée du mandat du Président de la République française ?",["5 ans","7 ans","4 ans","6 ans"],"Quinquennat depuis le référendum de 2000 (le septennat avant). Deux mandats consécutifs au maximum."],
[60,"I","Quelle est la durée du mandat des députés ?",["5 ans","6 ans","4 ans","9 ans"],"Sauf dissolution de l'Assemblée nationale par le Président."],
[61,"I","Quelle est la durée du mandat des sénateurs ?",["6 ans","5 ans","9 ans","3 ans"],"348 sénateurs élus au suffrage indirect ; le Sénat est renouvelé par moitié tous les 3 ans."],
[62,"I","Qui dirige l'action du gouvernement ?",["Le Premier ministre","Le Président du Sénat","Le maire de Paris","Le Conseil d'État"],"Article 21 de la Constitution."],
[63,"I","En France, est-ce possible d'adhérer à un parti politique ?",["Oui, c'est libre","Non, c'est interdit","Seulement pour les fonctionnaires","Seulement avec l'accord du préfet"],"Les partis se forment et exercent leur activité librement (Constitution, art. 4)."],
[64,"I","Qui sanctionne l'auteur d'un vol ?",["La justice (le juge)","Le maire","La victime","Le voisin"],"Seule la justice peut prononcer une peine ; se faire justice soi-même est interdit."],
[65,"I","Qui gère les collèges publics ?",["Le département","La commune","La région","L'Union européenne"],"Commune : écoles ; département : collèges ; région : lycées."],
[66,"I","Qui gère les écoles primaires et maternelles publiques ?",["La commune","Le département","La région","Le Sénat"],"La commune construit et entretient les écoles maternelles et élémentaires."],
[67,"I","Comment sont désignés les maires ?",["Ils sont élus par le conseil municipal","Ils sont nommés par le préfet","Ils sont élus directement par les habitants","Ils sont nommés par le Président"],"Les habitants élisent les conseillers municipaux, qui élisent le maire parmi eux."],
[68,"I","Quelle collectivité territoriale est responsable des transports régionaux ?",["La région","La commune","Le département","L'État"],"La région organise les TER et les transports scolaires et interurbains."],
[69,"I","Quelle est l'une des voies possibles pour modifier la Constitution ?",["Le référendum","Un décret du maire","Une décision du préfet","Un vote des conseils municipaux"],"Article 89 : révision par référendum ou par le Parlement réuni en Congrès (majorité des 3/5)."],
[70,"I","Qui assure l'intérim du Président de la République en cas de décès ?",["Le Président du Sénat","Le Premier ministre","Le Président de l'Assemblée nationale","Le ministre de l'Intérieur"],"Article 7 de la Constitution, jusqu'à l'élection d'un nouveau Président."],
[71,"I","Quel est le rôle du Conseil constitutionnel ?",["Vérifier que les lois respectent la Constitution","Voter les lois","Juger les crimes","Nommer les ministres"],"Il contrôle aussi la régularité des élections nationales et des référendums."],
[72,"I","Quelle condition est obligatoire pour se présenter à l'élection présidentielle ?",["Être de nationalité française","Être marié","Être diplômé de l'université","Avoir été maire"],"Il faut aussi avoir 18 ans et recueillir 500 parrainages."],
[73,"I","Combien y a-t-il de départements en France ?",["101","95","13","36"],"96 en métropole et 5 en outre-mer (Guadeloupe, Martinique, Guyane, La Réunion, Mayotte)."],
[74,"I","Comment est organisé le découpage administratif de la France ?",["En communes, départements et régions","En États fédérés","En provinces et duchés","En cantons indépendants"],"Ce sont les trois niveaux de collectivités territoriales (plus les collectivités à statut particulier)."],
[75,"I","Qui représente l'État dans un département ?",["Le préfet","Le maire","Le député","Le président du conseil départemental"],"Le préfet est nommé par décret du Président de la République en Conseil des ministres."],
[76,"I","Quel est le rôle du Président de la République ?",["Il veille au respect de la Constitution, est chef des armées et garant de l'indépendance nationale","Il vote les lois","Il juge les affaires pénales","Il gère les communes"],"Article 5 de la Constitution. Il nomme le Premier ministre, peut dissoudre l'Assemblée et soumettre une loi au référendum."],
[77,"I","Quel est le rôle du Premier ministre ?",["Il dirige l'action du gouvernement","Il commande seul l'armée","Il préside le Sénat","Il élit le Président"],"Il est responsable devant l'Assemblée nationale, qui peut le renverser par une motion de censure."],
[78,"I","Quel est le rôle du Défenseur des droits ?",["Défendre les droits des personnes face aux administrations et lutter contre les discriminations","Défendre les accusés devant le tribunal","Voter les lois","Diriger la police"],"Autorité indépendante créée en 2011, saisissable gratuitement par toute personne."],
[79,"I","En quelle année la citoyenneté européenne a-t-elle été créée ?",["1992","1957","1945","2004"],"Créée par le traité de Maastricht, signé en 1992."],
[80,"I","Quel est le dernier État à avoir intégré l'Union européenne en 2013 ?",["La Croatie","La Pologne","La Grèce","Le Portugal"],"La Croatie est devenue le 28e membre le 1er juillet 2013."],
[81,"P","Quelle est la devise de l'Union européenne ?",["Unie dans la diversité","Liberté, Égalité, Fraternité","Un pour tous, tous pour un","L'union fait la force"],"Devise adoptée en 2000."],
[82,"I","Qui a composé l'hymne de l'Union européenne ?",["Ludwig van Beethoven","Mozart","Rouget de Lisle","Chopin"],"L'hymne européen reprend le prélude de l'Ode à la joie, de la 9e symphonie de Beethoven."],
[83,"I","Quand est célébrée la journée de l'Europe ?",["Le 9 mai","Le 14 juillet","Le 1er janvier","Le 11 novembre"],"En souvenir de la déclaration Schuman du 9 mai 1950."],
[84,"I","Où est le siège de la Banque centrale européenne ?",["À Francfort","À Paris","À Bruxelles","À Luxembourg"],"La BCE, à Francfort (Allemagne), gère l'euro."],
[85,"I","Où est le siège de la Commission européenne ?",["À Bruxelles","À Strasbourg","À Francfort","À Genève"],"Bruxelles (Belgique)."],
[86,"I","Qui siège au Parlement européen ?",["Les députés européens élus par les citoyens de l'Union","Les chefs d'État","Les ministres des Affaires étrangères","Les maires des capitales"],"Ils sont élus au suffrage universel direct tous les 5 ans."],
[87,"I","Combien d'États font partie de l'Union européenne au 1er janvier 2025 ?",["27","28","25","30"],"27 États membres depuis le départ du Royaume-Uni en 2020."],
[88,"I","En quelle année le traité de Maastricht, qui marque la fondation de l'Union européenne, a-t-il été signé ?",["1992","1957","1951","2002"],"Signé le 7 février 1992."],
[89,"I","Quel traité concerne la construction de l'Union européenne ?",["Le traité de Maastricht","Le traité de Versailles","Le traité de Verdun","Le traité de Westphalie"],"Les traités de Rome (1957), Maastricht (1992) et Lisbonne (2007) jalonnent la construction européenne."],
[90,"I","Quel État a quitté l'Union européenne en 2020 ?",["Le Royaume-Uni","La Suisse","La Norvège","L'Irlande"],"Le Brexit est effectif depuis le 31 janvier 2020. La Suisse et la Norvège n'ont jamais été membres."],
[91,"I","Quel est l'hymne de l'Union européenne ?",["L'Ode à la joie","La Marseillaise","Le Chant des partisans","God Save the King"],"Extrait de la 9e symphonie de Beethoven."],
[92,"I","De quoi est composé le drapeau européen ?",["Un cercle de 12 étoiles dorées sur fond bleu","27 étoiles sur fond blanc","Trois bandes verticales","Une croix blanche sur fond rouge"],"Le nombre 12 symbolise la perfection et l'unité ; il ne dépend pas du nombre d'États."],
[93,"I","Qui élit les députés européens ?",["Les citoyens de l'Union européenne","Les gouvernements nationaux","La Commission européenne","Les maires"],"Un citoyen européen résidant en France peut voter en France aux européennes."],
[94,"I","Où est le siège du Parlement européen ?",["À Strasbourg","À Bruxelles","À Francfort","À Rome"],"Les sessions plénières ont lieu à Strasbourg (des réunions se tiennent aussi à Bruxelles)."],
[95,"D","À quoi sert le droit de grève ?",["À permettre aux salariés de cesser le travail pour défendre leurs revendications professionnelles","À ne pas travailler quand on est fatigué","À bloquer les élections","À obtenir des congés supplémentaires sans motif"],"Le droit de grève est reconnu par le préambule de la Constitution de 1946 ; il s'exerce dans le cadre des lois."],
[96,"D","Au nom de quoi l'État justifie-t-il la restriction des droits ?",["De l'ordre public (sécurité, santé, tranquillité publiques)","Des convictions du Président","D'une religion","Des intérêts d'une entreprise"],"Les libertés peuvent être limitées par la loi pour préserver l'ordre public et les droits d'autrui."],
[97,"D","Laquelle de ces citations est inscrite dans la Déclaration des droits de l'homme et du citoyen de 1789 ?",["« Les hommes naissent et demeurent libres et égaux en droits »","« Liberté, Égalité, Fraternité »","« Unie dans la diversité »","« Travail, Famille, Patrie »"],"Article 1er de la DDHC."],
[98,"D","L'article 4 de la DDHC affirme que « la liberté consiste à pouvoir faire tout ce qui ne nuit pas à autrui ». Qu'est-ce que cela signifie ?",["Ma liberté s'arrête là où commence celle des autres","On peut tout faire sans limite","La liberté est réservée aux citoyens","Seul l'État est libre"],"Les limites de la liberté sont fixées par la loi pour protéger les droits des autres."],
[99,"D","Que dit l'article 1er de la Constitution française ?",["La France est une République indivisible, laïque, démocratique et sociale","Le Président est élu pour 5 ans","Le français est la langue de la République","Paris est la capitale"],"Il garantit aussi l'égalité devant la loi sans distinction d'origine, de race ou de religion. La langue est à l'article 2."],
[100,"D","Que garantit la liberté de la presse ?",["La possibilité de publier des informations et des opinions sans censure préalable","Le droit de diffamer","L'obligation pour les journaux de soutenir le gouvernement","La gratuité des journaux"],"Loi du 29 juillet 1881. La presse reste responsable de ses abus (diffamation, injure)."],
[101,"D","Que permet la liberté de circulation ?",["Se déplacer librement sur le territoire et en sortir","Conduire sans permis","Entrer chez les autres","Ne pas respecter le code de la route"],"Elle peut être limitée pour des raisons d'ordre public ou de santé."],
[102,"D","Que signifie être citoyen d'un État ?",["Avoir la nationalité de cet État, avec des droits (voter) et des devoirs (respecter les lois)","Habiter dans cet État","Travailler dans cet État","Payer des impôts dans cet État"],"La citoyenneté donne notamment les droits civiques et politiques."],
