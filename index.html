<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171930" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Civique">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Prépa Examen Civique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,700;1,500&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: a civic workbook. Top bar with five sections, one centered column (max 880px), official numbering on every question. */
:root{
  --bg:#f6f7fb; --surface:#ffffff; --sunk:#eceef6; --line:#d8dbe8;
  --fg:#16182b; --muted:#5a5f78;
  --bleu:#000091; --bleu-soft:#e3e3fd; --rouge:#c9191e; --rouge-soft:#fde4e4;
  --ok:#18753c; --ok-soft:#dcf2e3; --warn:#9a5b00; --warn-soft:#fdf0d6;
  --font-display:"Spectral", Georgia, "Times New Roman", serif;
  --font-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e0f1c; --surface:#171930; --sunk:#11132a; --line:#2c2f4d;
  --fg:#eceef8; --muted:#a2a6c4;
  --bleu:#9a9aff; --bleu-soft:#24265a; --rouge:#ff7a7f; --rouge-soft:#45191f;
  --ok:#5fd38a; --ok-soft:#173523; --warn:#f1b55a; --warn-soft:#3a2a10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0f1c; --surface:#171930; --sunk:#11132a; --line:#2c2f4d;
  --fg:#eceef8; --muted:#a2a6c4;
  --bleu:#9a9aff; --bleu-soft:#24265a; --rouge:#ff7a7f; --rouge-soft:#45191f;
  --ok:#5fd38a; --ok-soft:#173523; --warn:#f1b55a; --warn-soft:#3a2a10; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.tricolor{height:4px;background:linear-gradient(90deg,var(--bleu) 0 33.3%,var(--surface) 33.3% 66.6%,var(--rouge) 66.6%)}
.topin{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.15rem;letter-spacing:.01em;color:var(--fg);text-decoration:none;white-space:nowrap}
.brand small{font-family:var(--font-mono);font-weight:400;font-size:.7rem;color:var(--muted);margin-left:6px;letter-spacing:.06em}
nav.tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;max-width:100%}
nav.tabs a{padding:6px 10px;border-radius:6px;text-decoration:none;color:var(--muted);font-weight:700;font-size:.92rem;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--bleu);background:var(--bleu-soft)}
nav.tabs a:hover{color:var(--fg)}
main{padding-block:28px 64px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:2rem}h2{font-size:1.45rem}h3{font-size:1.1rem}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.lead{color:var(--muted);max-width:62ch}
.eyebrow{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.btn{font:inherit;font-weight:700;border-radius:8px;padding:10px 18px;border:1px solid var(--bleu);background:var(--bleu);color:var(--surface);cursor:pointer}
.btn.ghost{background:transparent;color:var(--bleu)}
.btn.small{padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,a:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--rouge);outline-offset:2px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
/* format strip */
.format{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.format div{padding:14px 16px;border-right:1px solid var(--line)}
.format div:last-child{border-right:0}
.format b{display:block;font-family:var(--font-mono);font-size:1.5rem;color:var(--bleu)}
.format span{font-size:.85rem;color:var(--muted)}
@media (max-width:560px){.format{grid-template-columns:repeat(2,1fr)}.format div:nth-child(2){border-right:0}.format div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
/* readiness */
.ready{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.gauge{font-family:var(--font-display);font-size:3.2rem;font-weight:700;color:var(--bleu);line-height:1}
.themebars{display:flex;flex-direction:column;gap:10px}
.tb{display:grid;grid-template-columns:minmax(0,1fr) 120px 52px;gap:12px;align-items:center;font-size:.92rem}
.tb .bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;display:flex}
.tb .bar i{display:block;height:100%}
.tb .bar i.m{background:var(--ok)}.tb .bar i.l{background:var(--warn)}
@media (max-width:480px){.tb{grid-template-columns:1fr 70px 44px}}
/* question */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}
.qmeta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.06em;padding:3px 8px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.tag.sit{background:var(--rouge-soft);color:var(--rouge)}
.tag.ext{background:var(--warn-soft);color:var(--warn)}
.tag.src{background:var(--bleu-soft);color:var(--bleu)}
.tag.trap{background:var(--warn-soft);color:var(--warn)}
.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:70ch}
.qtext{font-family:var(--font-display);font-size:1.3rem;font-weight:500;margin-bottom:18px;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;width:100%}
.opt:hover:not(:disabled){border-color:var(--bleu)}
.opt .k{font-family:var(--font-mono);font-weight:600;color:var(--muted);min-width:1.2em}
.opt.sel{border-color:var(--bleu);background:var(--bleu-soft)}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--rouge);background:var(--rouge-soft)}
.opt:disabled{cursor:default}
.expl{margin-top:16px;padding:14px 16px;border-left:3px solid var(--bleu);background:var(--sunk);border-radius:0 8px 8px 0}
.expl b{color:var(--bleu)}
/* exam */
.examhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.timer{font-family:var(--font-mono);font-size:1.4rem;font-weight:600;padding:4px 12px;border-radius:6px;background:var(--sunk)}
.timer.low{color:var(--rouge);background:var(--rouge-soft)}
.qnav{display:grid;grid-template-columns:repeat(20,1fr);gap:4px}
@media (max-width:640px){.qnav{grid-template-columns:repeat(10,1fr)}}
.qnav button{font-family:var(--font-mono);font-size:.75rem;padding:6px 0;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.qnav button.ans{background:var(--bleu-soft);color:var(--bleu);border-color:transparent}
.qnav button.cur{outline:2px solid var(--bleu)}
.qnav button.good{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.qnav button.bad{background:var(--rouge-soft);color:var(--rouge);border-color:transparent}
/* result = attestation */
.attest{border:1.5px solid var(--fg);border-radius:4px;padding:28px;background:var(--surface);position:relative}
.attest .seal{position:absolute;right:20px;top:20px;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;text-align:center;font-family:var(--font-mono);font-size:.68rem;font-weight:600;letter-spacing:.08em;transform:rotate(-8deg);border:2px solid currentColor}
.attest .seal.ok{color:var(--ok)}.attest .seal.ko{color:var(--rouge)}
.score{font-family:var(--font-display);font-size:3.4rem;font-weight:700;line-height:1}
.score small{font-size:1.4rem;color:var(--muted)}
@media (max-width:480px){.attest .seal{position:static;margin-bottom:12px}}
table.sum{width:100%;border-collapse:collapse;font-size:.93rem}
table.sum td,table.sum th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
table.sum th,table.sum th.r{font-family:var(--font-body);font-size:.85rem;color:var(--muted);font-weight:700}
.tablebox{overflow-x:auto;max-width:100%}
.fbody,.panel,.attest{min-width:0}
.chrono{table-layout:auto}
table.sum td.r,table.sum th.r{text-align:right;font-family:var(--font-mono)}
/* fiches */
.fichelist{display:flex;flex-direction:column;gap:10px}
details.fiche{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.fiche summary{cursor:pointer;padding:14px 18px;font-weight:700;display:flex;justify-content:space-between;gap:12px;align-items:center;list-style:none}
details.fiche summary::-webkit-details-marker{display:none}
details.fiche summary::after{content:"+";font-family:var(--font-mono);color:var(--muted)}
details.fiche[open] summary::after{content:"−"}
.fbody{padding:0 18px 18px;max-width:72ch}
.fbody ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.fbody p{margin-bottom:8px}
.chrono{border-collapse:collapse;width:100%}
.chrono td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.chrono td:first-child{font-family:var(--font-mono);font-weight:600;color:var(--bleu);white-space:nowrap}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{font:inherit;font-size:.9rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--bleu);border-color:var(--bleu);color:var(--surface)}
.done-chip{font-family:var(--font-mono);font-size:.7rem;color:var(--ok)}
/* heatmap */
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(22px,1fr));gap:3px}
.heat button{aspect-ratio:1;max-width:100%;border:0;border-radius:3px;background:var(--sunk);cursor:pointer;padding:0;font-family:var(--font-mono);font-size:.55rem;color:transparent}
.heat button:hover{color:var(--fg)}
.heat button.l{background:var(--warn)}.heat button.m{background:var(--ok)}.heat button.w{background:var(--rouge)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.chartbox{overflow-x:auto}
.chartbox svg{display:block;width:100%;min-width:320px;height:auto}
.note{font-size:.85rem;color:var(--muted)}
.syncline{font-size:.78rem;color:var(--muted);font-family:var(--font-mono)}
.flipcard{display:flex;flex-direction:column;gap:14px;align-items:flex-start;text-align:left;font:inherit;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:24px;min-height:220px;cursor:pointer;width:100%}
.flipcard.on{border-color:var(--bleu)}
.flipcard .fq{font-family:var(--font-display);font-size:1.3rem;font-weight:500}
.flipcard .fa{padding:12px 14px;border-left:3px solid var(--bleu);background:var(--sunk);border-radius:0 8px 8px 0;max-width:68ch}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
@media (prefers-reduced-motion:no-preference){.opt{transition:border-color .12s,background .12s}}

/* translation popup */
.trpop{position:fixed;z-index:20;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 10px 30px rgba(10,12,40,.25);display:flex;flex-direction:column;gap:10px}
.trpop .trw{font-family:var(--font-display);font-size:1.25rem;font-weight:700}
.trpop .trt{font-size:1.1rem}
.trpop .trs{padding:10px 12px;background:var(--sunk);border-radius:8px;font-size:.95rem}
.trpop .trsrc{font-family:var(--font-mono);font-size:.7rem;color:var(--muted);letter-spacing:.04em}
::highlight(trword){background-color:var(--bleu-soft);color:var(--bleu)}
@media (hover:none){main{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}}
@media (max-width:700px){.trpop{bottom:calc(76px + env(safe-area-inset-bottom,0px))}}
/* phone layout (iPhone 16: 393 x 852 pt) */
html{-webkit-text-size-adjust:100%}
button,a,.opt,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.tabbar{display:none}
@media (max-width:700px){
  nav.tabs{display:none}
  .topin{padding-block:8px}
  .brand{font-size:1.05rem}
  h1{font-size:1.6rem} h2{font-size:1.3rem}
  main{padding-block:20px calc(88px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
    padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:50px;font-size:.66rem;font-weight:700;color:var(--muted);text-decoration:none;border-radius:10px}
  .tabbar a[aria-current="page"]{color:var(--bleu);background:var(--bleu-soft)}
  .tabbar svg{width:22px;height:22px}
  .panel{padding:16px}
  .qcard{padding:18px} .qtext{font-size:1.18rem;margin-bottom:14px}
  .opt{min-height:52px;padding:12px}
  .seg button{min-height:40px;padding:8px 14px}
  .btn{min-height:46px} .btn.small{min-height:42px}
  .qnav{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;padding-block:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .qnav::-webkit-scrollbar{display:none}
  .qnav button{flex:0 0 42px;min-height:42px;font-size:.85rem;scroll-snap-align:center}
  .examhead{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,49px));z-index:4;background:var(--bg);padding-block:8px;flex-wrap:nowrap;box-shadow:0 1px 0 var(--line)}
  .examhead .eyebrow{letter-spacing:.06em}
  .timer{font-size:1.15rem;flex:0 0 auto}
  .heat{grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:4px}
  .tb{grid-template-columns:minmax(0,1fr) 72px 44px;gap:10px}
  .attest{padding:20px} .score{font-size:2.8rem}
  .flipcard{min-height:260px;padding:20px}
  .gauge{font-size:2.8rem}
  details.fiche summary{min-height:48px}
}

.toolnav{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.toolnav a{font-weight:700;font-size:.92rem;padding:8px 12px;border-radius:8px;color:var(--muted);text-decoration:none}
.toolnav a[aria-current="page"]{color:var(--bleu);background:var(--bleu-soft)}
.modecards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.modecards a{display:flex;flex-direction:column;gap:4px;padding:14px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--fg);background:var(--sunk)}
.modecards a b{color:var(--bleu)} .modecards a span{font-size:.9rem;color:var(--muted)}
@media (max-width:640px){.modecards{grid-template-columns:1fr}}
.tl{display:flex;flex-direction:column;gap:20px}
.tlper h3{margin:0 0 8px;font-size:1rem;color:var(--rouge)}
.tlper ol{list-style:none;margin:0;padding:0 0 0 14px;border-left:3px solid var(--bleu-soft);display:flex;flex-direction:column;gap:6px}
.tlper li{position:relative}
.tlper li::before{content:"";position:absolute;left:-21px;top:16px;width:11px;height:11px;border-radius:50%;background:var(--bleu);border:2px solid var(--surface)}
.tlev{font:inherit;display:grid;grid-template-columns:minmax(84px,auto) 1fr;gap:10px;align-items:baseline;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--fg);cursor:pointer}
.tlev[aria-expanded="true"]{border-color:var(--bleu)}
.tly{font-family:var(--font-mono);font-weight:700;color:var(--bleu);font-size:.85rem}
.tlx{margin:6px 0 4px 12px;color:var(--muted);font-size:.95rem}
.ordlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ord{font:inherit;display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);cursor:pointer;min-height:52px}
.ord.sel{border-color:var(--bleu);background:var(--bleu-soft)}
.ord.good{border-color:var(--ok);background:var(--ok-soft)} .ord.bad{border-color:var(--rouge);background:var(--rouge-soft)}
.ordn{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;border:1px solid var(--line);background:var(--surface);font-family:var(--font-mono)}
.btn[disabled]{opacity:.45;cursor:default}
.frmap{width:100%;height:auto;max-height:72vh;display:block;touch-action:manipulation}
.frmap .rg{fill:var(--sunk);stroke:var(--muted);stroke-width:.9;cursor:pointer;transition:fill .12s}
@media (hover:hover){.frmap .rg:hover{fill:var(--bleu-soft)}}
.frmap .rg.good{fill:var(--ok)} .frmap .rg.bad{fill:var(--rouge)} .frmap .rg.target{fill:var(--bleu)}
.frmap .rg.lv-m{fill:var(--ok-soft);stroke:var(--ok)} .frmap .rg.lv-l{fill:var(--warn-soft);stroke:var(--warn)} .frmap .rg.lv-w{fill:var(--rouge-soft);stroke:var(--rouge)}
.frmap .rg.target.lv-m,.frmap .rg.target.lv-l,.frmap .rg.target.lv-w{fill:var(--bleu)}
.omframe{fill:none;stroke:var(--line)}
.omlab{font-size:11px;text-anchor:middle;fill:var(--muted);font-family:inherit}
.maplab{font-size:12px;font-weight:700;text-anchor:middle;dominant-baseline:middle;fill:var(--fg);paint-order:stroke;stroke:var(--surface);stroke-width:3px;pointer-events:none}
.mapq{font-size:1.15rem;margin:0}
.okline{color:var(--ok);font-weight:600;margin:0} .badline{color:var(--rouge);font-weight:600;margin:0}
.mars .mline{margin:0;font-size:1.05rem;font-weight:600}
.muk{display:block;font-weight:400;font-size:.9rem;color:var(--muted)}
.mnote{margin:2px 0 8px;padding:8px 10px;border-left:3px solid var(--rouge);background:var(--sunk);font-size:.92rem;border-radius:0 6px 6px 0}
.blank{display:inline-block;min-width:4em;border-bottom:2px solid var(--bleu);color:transparent}
</style>
</head>
<body>


<header class="top">
  <div class="tricolor"></div>
  <div class="wrap topin">
    <a class="brand" href="#accueil">Prépa Examen Civique<small>NAT · 2026</small></a>
    <nav class="tabs" aria-label="Sections">
      <a href="#accueil">Accueil</a>
      <a href="#examen">Examen blanc</a>

["S17","P","Votre association culturelle veut organiser une fête dans un parc public. Que faut-il faire ?",["Demander une autorisation à la mairie","Rien, l'espace public est libre","Demander l'accord de la police uniquement","Payer une taxe au préfet"],"L'occupation de l'espace public pour un événement nécessite l'accord de la commune."],
["S18","P","Un ami refuse de payer ses impôts car il n'est pas d'accord avec le gouvernement. A-t-il raison ?",["Non, l'impôt est une obligation pour tous, quelle que soit son opinion","Oui, c'est sa liberté","Oui, s'il vote contre","Oui, s'il est étranger"],"La contribution commune est obligatoire (DDHC, art. 13). On exprime son désaccord par le vote."],

["S21","D","Votre conjoint vous empêche de travailler et confisque votre carte bancaire. De quoi s'agit-il ?",["D'une violence économique au sein du couple, que la loi sanctionne","D'une décision normale du chef de famille","D'un choix de couple sans conséquence","D'une obligation du mariage"],"Le 3919 (Violences Femmes Info) est gratuit et anonyme."],

["S31","D","Vous trouvez un portefeuille avec des papiers d'identité dans la rue. Que faites-vous ?",["Le déposer au commissariat, à la gendarmerie ou au service des objets trouvés de la mairie","Le garder","Prendre l'argent et jeter le reste","Le laisser par terre"],"S'approprier un objet trouvé peut constituer un délit."],
["S32","D","Votre voisin de palier fait du bruit très fort tous les soirs après 22 heures. Que pouvez-vous faire ?",["Lui en parler, puis contacter le propriétaire, un conciliateur ou la police si le trouble continue","Couper son électricité","Casser sa porte","Faire encore plus de bruit"],"Le tapage nocturne est une infraction. Le conciliateur de justice est gratuit."],

["S44","D","Un ami veut publier sur les réseaux sociaux son opinion sur une guerre qui se déroule à l'étranger. Que dit la loi ?",["Il peut exprimer son opinion, mais pas faire l'apologie du terrorisme ou de crimes de guerre, ni appeler à la haine","Il est interdit de parler d'une guerre étrangère","Il doit demander une autorisation à la préfecture","Tout est permis car il s'agit d'un autre pays"],"La liberté d'expression a les mêmes limites quel que soit le sujet.","c"],

["S46","D","Un propriétaire refuse ouvertement de vous louer un appartement à cause de votre origine. Que pouvez-vous faire ?",["Porter plainte ou saisir le Défenseur des droits : c'est une discrimination punie par la loi","Rien, le propriétaire choisit librement","Payer plus cher pour le convaincre","Entrer dans le logement malgré tout"],"La discrimination au logement est un délit (jusqu'à 3 ans de prison et 45 000 € d'amende).","p"],
["S47","P","Un enseignant d'école publique essaie de convaincre ses élèves d'adopter sa religion. Que dit la règle ?",["C'est interdit : l'enseignant doit respecter la neutralité et la laïcité","C'est permis s'il est convaincu","C'est permis en dehors des cours de maths","C'est permis si les parents ne se plaignent pas"],"Le prosélytisme est interdit aux agents publics. Les parents peuvent alerter la direction ou l'inspection.","p"],
["S48","D","Vous êtes placé en garde à vue. Quand pouvez-vous demander un avocat ?",["Dès le début de la garde à vue","Seulement après 24 heures","Seulement devant le juge","Jamais en garde à vue"],"L'avocat peut assister la personne dès la première heure, lors des auditions et confrontations. Un avocat commis d'office est gratuit.","p"],
["S49","D","Votre employeur ne vous verse pas votre salaire depuis deux mois. Quelle démarche rapide existe ?",["Saisir le conseil de prud'hommes en référé (procédure d'urgence)","Prendre du matériel de l'entreprise en compensation","Arrêter de venir sans prévenir","Écrire au maire"],"Le référé prud'homal permet d'obtenir rapidement le paiement des salaires dus.","p"],
["S50","D","Toutes les banques refusent de vous ouvrir un compte. Que pouvez-vous faire ?",["Demander à la Banque de France de faire jouer le « droit au compte »","Renoncer à avoir un compte","Utiliser le compte d'un ami","Saisir la préfecture"],"La Banque de France désigne une banque qui doit ouvrir un compte avec les services de base gratuits.","p"],
["S51","D","Votre téléviseur neuf tombe en panne 18 mois après l'achat. Le vendeur refuse de le réparer. Quel droit avez-vous ?",["La garantie légale de conformité de 2 ans : le vendeur doit réparer ou remplacer","Aucun, la garantie est d'un an","Seulement si vous avez acheté une extension de garantie","Seulement si le fabricant est français"],"Pendant 2 ans pour un bien neuf, le défaut est présumé exister dès l'achat : pas besoin de le prouver.","p"],
["S52","P","Votre fille de 12 ans raconte que son enseignante a parlé des religions en classe. Que lui expliquez-vous ?",["L'école publique peut présenter les faits religieux de façon neutre, comme des connaissances","C'est interdit, il faut porter plainte","Seule la famille peut parler de religion","L'enseignante cherche à la convertir"],"L'enseignement laïque du fait religieux fait partie des programmes (histoire, lettres, arts).","p"],
["S53","P","Votre fils de 14 ans refuse d'aller au cours de sport parce qu'il y a des filles dans sa classe. Que dit la règle ?",["La mixité est la règle : il doit suivre le cours comme tous les élèves","Il peut être dispensé pour ce motif","L'école doit créer un cours séparé","Les parents décident seuls"],"L'éducation physique est obligatoire ; seule une raison médicale justifiée permet une dispense.","p"],
["S54","P","Une collègue découvre qu'elle est payée 15 % de moins qu'un collègue masculin au même poste et avec la même ancienneté. Que peut-elle faire ?",["Demander des explications aux ressources humaines en invoquant l'égalité salariale, puis saisir l'inspection du travail ou les prud'hommes si besoin","Se taire pour garder son poste","Démissionner immédiatement","Exiger le licenciement de son collègue"],"À travail égal, salaire égal : l'employeur doit justifier tout écart par des critères objectifs.","p"],
["S55","P","À la mairie, l'agent du guichet porte un signe religieux très visible. Est-ce conforme ?",["Non, les agents publics sont tenus à une stricte neutralité pendant leur service","Oui, c'est sa liberté","Oui, si les usagers sont d'accord","Oui, s'il ne parle pas de religion"],"Les agents publics ne peuvent manifester leurs convictions religieuses dans l'exercice de leurs fonctions.","p"],
["S56","P","Un collègue refuse de travailler en équipe avec une femme. Que dit la loi ?",["C'est une discrimination fondée sur le sexe, interdite au travail","C'est son droit","C'est à la collègue de changer d'équipe","C'est autorisé pour des raisons religieuses"],"L'employeur doit faire respecter l'égalité et peut sanctionner ce comportement.","p"],
["S57","P","Un ami étranger, citoyen italien, vit en France depuis 3 ans. Peut-il voter aux élections municipales ?",["Oui, les citoyens de l'Union européenne peuvent voter aux municipales et aux européennes","Non, seuls les Français votent","Oui, à toutes les élections","Oui, seulement à la présidentielle"],"Ils doivent s'inscrire sur les listes électorales complémentaires. Ils ne votent ni à la présidentielle ni aux législatives.","c"],
["S58","D","Une personne vous propose d'acheter un pistolet sur internet, sans formalité. Que dit la loi ?",["L'achat d'arme à feu est strictement encadré : la plupart nécessitent une autorisation ou une licence (tir sportif, chasse)","C'est libre pour les majeurs","C'est libre si l'arme est livrée à domicile","C'est autorisé pour se défendre chez soi"],"Acquérir ou détenir une arme sans autorisation est un délit. Les armes de poing relèvent en général de la catégorie B (autorisation préfectorale).","c"],
["S59","P","Votre voisine vous dit que son mari lui interdit de sortir seule et de voir ses amies. Que pouvez-vous lui conseiller ?",["Appeler le 3919 ou porter plainte : contrôler la liberté de son conjoint peut constituer des violences psychologiques","C'est normal dans un couple marié","D'obéir à son mari","De ne rien dire pour éviter les problèmes"],"L'égalité dans le couple est garantie ; le contrôle coercitif est puni.",""],
["S60","P","Un restaurant affiche à l'entrée : « Interdit aux personnes portant un signe religieux ». Est-ce légal ?",["Non, un commerce ne peut pas refuser un client en raison de sa religion","Oui, c'est un lieu privé","Oui, au nom de la laïcité","Oui, si c'est écrit à l'entrée"],"La laïcité s'impose à l'État, pas aux clients d'un commerce. Le refus de service discriminatoire est un délit.",""],
["S61","P","Une entreprise privée peut-elle interdire à ses salariés en contact avec la clientèle de porter des signes religieux ?",["Oui, si une clause de neutralité est prévue dans le règlement intérieur, justifiée et proportionnée","Non, jamais","Oui, sans aucune règle","Oui, mais seulement pour certaines religions"],"Le Code du travail l'admet dans un cadre précis ; la règle doit viser tous les signes de la même façon.",""],
["S62","P","Une femme veut s'inscrire seule à une formation professionnelle, mais son frère dit qu'elle a besoin de son autorisation. Qui a raison ?",["Elle : une femme majeure décide librement de sa formation et de son travail","Son frère, chef de famille","Son père uniquement","Le maire"],"Les femmes majeures ont les mêmes droits que les hommes et n'ont besoin de l'autorisation de personne.",""],
["S63","P","Dans un hôpital public, une patiente demande à être soignée par une femme médecin. Que se passe-t-il ?",["Le service tient compte de la demande si possible, mais en urgence elle ne peut pas refuser le médecin présent","L'hôpital doit toujours satisfaire la demande","La patiente doit quitter l'hôpital","C'est interdit de le demander"],"Le libre choix du praticien existe, dans les limites de l'organisation du service et de l'urgence.",""],
["S64","P","Le jour de l'Aïd ou de Yom Kippour, un salarié veut poser un jour de congé. Est-ce possible ?",["Oui, il peut demander un congé, que l'employeur accorde selon les besoins du service","Non, seules les fêtes chrétiennes sont fériées et aucun congé n'est possible","Oui, l'employeur doit toujours accepter","Non, c'est contraire à la laïcité"],"Les autorisations d'absence pour fête religieuse sont possibles mais pas de droit.",""],
["S65","P","Lors d'une campagne électorale, un candidat promet de réserver les logements sociaux aux personnes d'une seule religion. Que dit la loi ?",["Ce serait une discrimination contraire à la Constitution","C'est une promesse comme une autre","C'est autorisé si la majorité vote pour","C'est permis au niveau local"],"L'égalité devant la loi sans distinction de religion est garantie par l'article 1er de la Constitution.",""],
["S66","P","Un parent veut que sa fille de 16 ans arrête l'école pour se marier. Que dit la loi ?",["C'est interdit : le mariage est impossible avant 18 ans et la formation est obligatoire jusqu'à 18 ans","C'est possible avec l'accord du père","C'est possible si le mariage est religieux","C'est un choix familial"],"Le mariage forcé est un délit, et l'obligation de formation dure jusqu'à 18 ans.",""],
["S67","P","Un club de sport municipal refuse l'inscription d'un enfant handicapé sans chercher d'aménagement. Est-ce permis ?",["Non, c'est une discrimination liée au handicap","Oui, le club choisit ses membres","Oui, si le club est complet","Oui, si les autres parents sont d'accord"],"Le handicap fait partie des critères de discrimination interdits.",""],
["S68","P","Sur un marché, un commerçant refuse d'être payé par une femme et exige de parler à son mari. Comment qualifier ce comportement ?",["Une discrimination fondée sur le sexe","Une tradition acceptable","Un droit du commerçant","Un comportement laïque"],"Femmes et hommes sont égaux, y compris comme clients.",""],

// Naturalisation interview cards: [id, category, question, answer, tip]
const ENT = [
["E1","Procédure","Où se dépose une demande de naturalisation par décret ?","En ligne, sur le site de l'administration numérique des étrangers en France (ANEF). La plateforme de naturalisation de la préfecture instruit ensuite le dossier.",""],
["E2","Procédure","Combien coûte le dépôt d'une demande de naturalisation ?","Un timbre fiscal de 55 €. L'examen civique et le test de langue se paient à part, auprès des organismes agréés.",""],
["E3","Procédure","Quelle durée de résidence faut-il en principe pour demander la naturalisation par décret ?","5 ans de résidence habituelle et régulière en France. Cette durée est réduite à 2 ans après deux années d'études supérieures réussies en France, ou en cas de parcours exceptionnel d'intégration.",""],
["E4","Procédure","Quel niveau de français est exigé pour la naturalisation ?","Le niveau B2, à l'oral et à l'écrit, depuis le 1er janvier 2026. Il se prouve par un diplôme ou par un test reconnu (TCF, TEF…).",""],
["E5","Procédure","Depuis quand l'examen civique est-il obligatoire pour la naturalisation, et quel est le seuil ?","Depuis le 1er janvier 2026. Il faut au moins 32 bonnes réponses sur 40 (80 %).",""],
["E6","Procédure","Qu'est-ce que l'entretien d'assimilation ?","Un entretien individuel à la préfecture. L'agent vérifie votre connaissance de la France, votre adhésion aux principes et valeurs de la République et votre intégration (langue, vie sociale, travail).","Préparez des exemples concrets tirés de votre vie en France."],
["E7","Procédure","Quel document signez-vous pendant la procédure ?","La Charte des droits et devoirs du citoyen français, qui rappelle les principes, valeurs et symboles de la République.",""],
["E8","Procédure","Quel est le délai légal pour que l'administration réponde ?","18 mois à partir du dépôt du dossier complet (12 mois si vous résidez en France depuis au moins 10 ans). Ce délai peut être prolongé une fois de 3 mois.",""],
["E9","Procédure","Quelles décisions peut prendre l'administration ?","Accorder la nationalité (décret publié au Journal officiel), ajourner la demande (vous pourrez redéposer après un délai) ou la rejeter (refus motivé).",""],
["E10","Procédure","Comment contester un refus ou un ajournement ?","D'abord un recours administratif auprès du ministre de l'Intérieur dans les 2 mois. Ensuite, si besoin, un recours devant le tribunal administratif de Nantes.",""],
["E11","Conditions","Peut-on demander la naturalisation en étant en situation irrégulière ?","Non. Il faut être en situation régulière au moment de la demande et avoir sa résidence habituelle en France.",""],
["E12","Conditions","Quelles conditions de conduite (« bonnes vie et mœurs ») sont examinées ?","Le casier judiciaire et le comportement : une condamnation à 6 mois de prison ferme ou plus, ou pour certains crimes et délits, empêche la naturalisation. Le paiement des impôts et le respect des lois sont aussi vérifiés.",""],
["E13","Conditions","Quelle insertion professionnelle est attendue ?","Des ressources stables et suffisantes, en principe tirées de votre activité professionnelle.",""],
["E14","Conditions","Comment acquiert-on la nationalité par mariage ?","Par déclaration, après 4 ans de mariage avec un Français, si la communauté de vie est réelle et si le conjoint étranger parle français. La durée passe à 5 ans si le couple n'a pas résidé au moins 3 ans en France depuis le mariage.",""],
["E15","Conditions","La France oblige-t-elle à renoncer à sa nationalité d'origine ?","Non, la France autorise la double nationalité. Mais certains pays retirent leur nationalité à ceux qui en acquièrent une autre : renseignez-vous auprès de votre pays.",""],
["E16","Après la décision","Que deviennent les enfants mineurs d'un parent naturalisé ?","Ils deviennent français s'ils résident avec ce parent et s'ils sont mentionnés dans le décret (effet collectif).",""],
["E17","Après la décision","Peut-on changer de nom ou de prénom lors de la naturalisation ?","Oui, on peut demander la francisation de son nom ou de son prénom en même temps que la naturalisation, ou dans l'année qui suit le décret.",""],
["E18","Après la décision","Qu'est-ce que la cérémonie d'accueil dans la citoyenneté française ?","Une cérémonie organisée par la préfecture, en général dans les 6 mois après le décret. On y reçoit son décret de naturalisation et le livret du citoyen ; on chante la Marseillaise.",""],
["E19","Après la décision","Quels droits nouveaux obtient un nouveau Français ?","Voter et se présenter à toutes les élections, accéder à tous les emplois de la fonction publique, obtenir une carte d'identité et un passeport français, et la citoyenneté européenne.",""],
["E20","Après la décision","Quelles démarches faire après la naturalisation ?","S'inscrire sur les listes électorales, demander sa carte d'identité ou son passeport, et récupérer son acte de naissance français auprès du service central d'état civil de Nantes.",""],
["E21","Vos réponses","Pourquoi voulez-vous devenir français ?","Réponse personnelle et sincère : votre attachement à la France, vos années ici, votre famille, votre travail, l'envie de participer pleinement (voter).","Évitez de répondre seulement « pour le passeport » ou « pour les papiers »."],
["E22","Vos réponses","Racontez votre parcours depuis votre arrivée en France.","Date d'arrivée, études ou formation, emplois, lieux de vie, étapes importantes (famille, logement).","Soyez cohérent avec les dates et les documents de votre dossier."],
["E23","Vos réponses","Que signifie pour vous la laïcité ?","L'État est neutre et ne favorise aucune religion ; chacun est libre de croire ou de ne pas croire et de pratiquer dans le respect de la loi ; les agents publics sont neutres.","Ajoutez un exemple concret : l'école publique, la mairie, votre travail."],
["E24","Vos réponses","Que pensez-vous de l'égalité entre les femmes et les hommes ?","Femmes et hommes ont les mêmes droits : travail, salaire, vote, décisions dans le couple et pour les enfants, choix du conjoint.","Parlez de votre vie quotidienne, pas seulement de la loi."],
["E25","Vos réponses","Comment participez-vous à la vie en France ?","Exemples : travail, associations, bénévolat, école des enfants (réunions, conseil d'école), activités sportives ou culturelles, relations avec les voisins.","Préparez deux ou trois exemples précis."],
["E26","Vos réponses","Que faites-vous le 14 juillet, et que représente cette date ?","La fête nationale : prise de la Bastille (1789) et fête de la Fédération (1790). Évoquez le défilé, le feu d'artifice ou un bal populaire si vous y allez.",""],
["E27","Vos réponses","Que feriez-vous si votre enfant voulait épouser une personne d'une autre religion ?","Le mariage est un choix libre entre deux adultes consentants ; la loi interdit tout mariage forcé.","Les questions de valeurs testent votre adhésion aux principes de la République."],
["E28","Vos réponses","Que connaissez-vous de votre ville, de votre département et de votre région ?","Le nom du maire, la préfecture du département, le chef-lieu de la région, des lieux et événements locaux.","Révisez-les avant l'entretien : c'est une question fréquente."],
["E29","Vos réponses","Comment s'appelle le Président de la République et le Premier ministre actuels ?","Vérifiez les noms juste avant l'entretien : ils peuvent changer.","Connaître aussi le nom de votre maire et de votre député est un plus."],
["E30","Vos réponses","Que feriez-vous si vous étiez victime ou témoin d'une discrimination ?","Garder des preuves, en parler à la personne responsable, saisir le Défenseur des droits, porter plainte si c'est une infraction.",""]
];

 <li><b>Art. 1</b> : les hommes naissent et demeurent libres et égaux en droits.</li>
 <li><b>Art. 2</b> : liberté, propriété, sûreté, résistance à l'oppression.</li>
 <li><b>Art. 3</b> : la souveraineté réside dans la Nation.</li>
 <li><b>Art. 4</b> : la liberté, c'est faire tout ce qui ne nuit pas à autrui.</li>
 <li><b>Art. 6</b> : la loi est l'expression de la volonté générale.</li>
 <li><b>Art. 9</b> : présomption d'innocence. <b>Art. 10-11</b> : liberté d'opinion et d'expression.</li>
 <li><b>Art. 13</b> : contribution commune selon les facultés (impôt). <b>Art. 16</b> : garantie des droits et séparation des pouvoirs.</li>
 <li><b>Art. 17</b> : la propriété est un droit inviolable et sacré.</li>
 <li>Le candidat signe la <b>Charte des droits et devoirs du citoyen français</b> (art. 21-24 du Code civil).</li></ul>`]);
FICHES.I.push(["Outre-mer, Europe et monde (livret 2026)", `<ul>
 <li><b>12 territoires d'outre-mer :</b> 5 départements-régions (Guadeloupe, Martinique, Guyane, La Réunion, Mayotte) + Nouvelle-Calédonie, Polynésie française, Saint-Martin, Saint-Barthélemy, Saint-Pierre-et-Miquelon, Wallis-et-Futuna, TAAF.</li>
 <li><b>Schengen :</b> libre circulation sans contrôle aux frontières intérieures ; associés hors UE : Norvège, Islande, Suisse, Liechtenstein.</li>
 <li>Charte des droits fondamentaux de l'UE : <b>2000</b>. Devise de l'UE « Unie dans la diversité » : 2000 (le livret écrit « 2020 », c'est une coquille).</li>
 <li>Constitution adoptée par <b>référendum le 28 septembre 1958</b>.</li>
 <li>ONU : membre permanent du Conseil de sécurité, <b>droit de veto</b>. Ambassades ou consulats dans plus de 150 pays. Aussi OTAN, G7, G20, OIF.</li>
 <li>Vote : pièce d'identité obligatoire, sauf dans les communes de <b>moins de 1 000 habitants</b>.</li></ul>`]);
FICHES.D.push(["Infractions, justice et défense (livret 2026)", `<div class="tablebox"><table class="chrono">
 <tr><td>Contravention</td><td>Excès de vitesse, tapage nocturne. Amende, pas de prison. <b>Tribunal de police</b>.</td></tr>
 <tr><td>Délit</td><td>Vol, fraude fiscale, harcèlement moral, homicide involontaire, GPA. Jusqu'à <b>10 ans</b> de prison, amende ≥ 3 750 €. <b>Tribunal correctionnel</b>.</td></tr>
 <tr><td>Crime</td><td>Meurtre, viol, braquage, terrorisme. Jusqu'à la perpétuité. <b>Cour d'assises</b> ou cour criminelle.</td></tr></table></div>
 <ul><li>Vitesse &lt; 20 km/h : 68 € et 1 point. &gt; 50 km/h : délit. Alcool &gt; 0,8 g/l : jusqu'à 3 ans de prison, 9 000 €. Sans permis : 1 an, 15 000 €.</li>
 <li><b>Défense :</b> armée de métier et dissuasion nucléaire. Service militaire obligatoire supprimé en <b>1997</b>. Recensement à <b>16 ans</b>, puis JDC. Service militaire volontaire (8 mois, 18-25 ans) depuis 2026.</li>
 <li>Mineur voyageant sans ses parents : <b>autorisation de sortie du territoire</b>.</li>
 <li><b>Responsabilité civile :</b> réparer les dommages causés sans le vouloir, y compris par ses enfants mineurs ou ses animaux.</li></ul>`]);
FICHES.H.push(["Histoire : compléments du livret", `<div class="tablebox"><table class="chrono">
 <tr><td>466-511</td><td>Clovis unifie les royaumes francs, adopte le christianisme</td></tr>
 <tr><td>1412-1431</td><td>Jeanne d'Arc, guerre de Cent Ans</td></tr>
 <tr><td>1598</td><td>Édit de Nantes (Henri IV) : fin des guerres de religion</td></tr>
 <tr><td>1793</td><td>Le Louvre devient musée</td></tr>
 <tr><td>1880</td><td>Le 14 juillet devient fête nationale</td></tr>
 <tr><td>1903</td><td>Premier Tour de France</td></tr>
 <tr><td>1919</td><td>Traité de Versailles (28 juin), Société des Nations</td></tr>
 <tr><td>1942</td><td>Occupation totale de la France</td></tr>
 <tr><td>1946-1954</td><td>Décolonisation de l'Indochine</td></tr>
 <tr><td>1947</td><td>Le 1er mai devient férié</td></tr>
 <tr><td>1958</td><td>Constitution adoptée par référendum (28 septembre)</td></tr>
 <tr><td>Mai 1968</td><td>Mouvement étudiant et social, grèves</td></tr>
 <tr><td>1974</td><td>Mort de Georges Pompidou en fonction ; majorité à 18 ans</td></tr>
 <tr><td>1982</td><td>Première fête de la musique (21 juin)</td></tr>
 <tr><td>1984</td><td>Journées du patrimoine</td></tr>
 <tr><td>1997</td><td>Fin du service militaire obligatoire</td></tr>
 <tr><td>1998 / 2018</td><td>Coupes du monde de football</td></tr>
 <tr><td>2001</td><td>Loi Taubira : l'esclavage est un crime contre l'humanité (commémoration le 10 mai)</td></tr>
 <tr><td>2010</td><td>Interdiction de dissimuler son visage dans l'espace public</td></tr>
 <tr><td>2013</td><td>Mariage pour tous (17 mai) ; premier mariage à Montpellier (29 mai)</td></tr>
 <tr><td>2024</td><td>JO de Paris (100 ans après 1924)</td></tr></table></div>`]);
FICHES.H.push(["Personnalités naturalisées (livret 2026)", `<ul>
 <li><b>Léon Gambetta</b> : père de la IIIe République. <b>Marie Curie</b> : née en Pologne, 2 Nobel, Panthéon.</li>
 <li><b>Kandinsky</b> (art abstrait), <b>Chagall</b> (plafond de l'Opéra Garnier), peintres d'origine russe.</li>
 <li><b>Maurice Garin</b> : né en Italie, vainqueur du premier Tour de France (1903).</li>
 <li><b>Apollinaire</b> (« Alcools », « Calligrammes »), <b>Yourcenar</b> (première femme à l'Académie française), <b>Romain Gary</b> (deux Goncourt), <b>Andrée Chedid</b> (poétesse née au Caire).</li>
 <li><b>Joséphine Baker</b> (artiste et résistante), <b>Maria Casarès</b> (actrice), <b>Françoise Giroud</b> (L'Express).</li>
 <li><b>Haroun Tazieff</b> (volcanologue), <b>Georges Charpak</b> (Nobel de physique 1992).</li>
 <li><b>Miriam Makeba</b> (contre l'apartheid), <b>Dalida</b> (« Bambino »), <b>Georges Moustaki</b>.</li></ul>`]);
FICHES.H.push(["Géographie et économie (livret 2026)", `<ul>
 <li><b>68,6 millions</b> d'habitants, <b>675 000 km²</b>. <b>8 pays</b> frontaliers : Allemagne, Andorre, Belgique, Espagne, Italie, Luxembourg, Monaco, Suisse. 5 500 km de côtes.</li>
 <li><b>Mont Blanc</b> 4 810 m. Fleuves : Loire (le plus long), Seine (Paris), Garonne (Toulouse, Bordeaux), Rhône (Lyon), Rhin (frontière allemande).</li>
 <li>Volcans actifs : Antilles, La Réunion (<b>Piton de la Fournaise</b>), Mayotte. Plus grande forêt : <b>Amazonie guyanaise</b> ; forêt = 32 % de la métropole.</li>
 <li>Lascaux : <b>Dordogne</b>. Avignon : <b>Palais des Papes</b>.</li>
 <li><b>7e</b> puissance économique, <b>2e</b> puissance maritime (après les États-Unis), <b>1re</b> puissance agricole de l'UE. La Défense : premier quartier d'affaires d'Europe.</li>
 <li>Ports : Le Havre, Marseille-Fos, Dunkerque, Nantes-Saint-Nazaire. Secteurs : aéronautique et spatial (Kourou), luxe, agroalimentaire, énergie, pharmacie, numérique, automobile.</li></ul>`]);
FICHES.H.push(["Culture, fêtes et sport (livret 2026)", `<ul>
 <li>Plus de 1 200 musées. <b>Louvre</b> (1793, la Joconde) ; <b>Orsay</b> (ancienne gare, impressionnistes).</li>
 <li>Artistes : Rouget de Lisle, George Sand (Aurore Dupin), Baudelaire, Cézanne (père de la peinture moderne), Rodin (Le Penseur), Monet (Impression, soleil levant), Renoir, Debussy, Suzanne Valadon, Simone de Beauvoir, Camus (journal Combat), Duras (L'Amant), Piaf (La Vie en rose).</li>
 <li>Festivals : théâtre à <b>Avignon</b>, cinéma à <b>Cannes</b>, jazz à <b>Marciac</b>. Journées du patrimoine en septembre (1984).</li>
 <li>Français : <b>4e</b> langue du monde, 300 millions de locuteurs ; OIF : <b>93</b> États et gouvernements.</li>
 <li>Fêtes : 14 juillet (depuis 1880), 1er mai (férié depuis 1947, muguet), fête de la musique le <b>21 juin</b> (1982).</li>
 <li>Sport : Tour de France (1903), Coupes du monde <b>1998</b> (contre le Brésil) et <b>2018</b> (contre la Croatie), JO de Paris 1924 et 2024.</li>
 <li>Gastronomie : repas gastronomique à l'UNESCO ; champagne et AOC ; brocciu (Corse), camembert (Normandie), maroilles (Nord).</li></ul>`]);
FICHES.V.push(["Logement, transports, espace public (livret 2026)", `<ul>
 <li>Achat : acte chez le <b>notaire</b>. Construire : <b>permis de construire</b> en mairie. 40 % des habitants sont locataires.</li>
 <li>Logement social (HLM) : demande sur demande-logement-social.gouv.fr.</li>
 <li>Conduire : permis, carte grise, assurance, contrôle technique. Places handicapées : carte mobilité inclusion.</li>
 <li><b>Tabac</b> (loi Évin, 1991) : interdit dans les lieux fermés et, depuis le 1er juillet 2025, dans les parcs, plages, abribus, abords des écoles. Amende : <b>135 €</b>.</li>
 <li><b>Alcool :</b> interdit aux moins de 18 ans ; ivresse publique : jusqu'à 150 €.</li>
 <li>Interdits : déchets jetés par terre, dépôts sauvages, graffitis, nuisances sonores ; ramasser les déjections de son chien.</li>
 <li>Environnement : 500 kg de déchets par habitant et par an ; tri des biodéchets obligatoire depuis 2024 ; sacs plastiques interdits depuis 2017 ; chauffage à 19 °C ; transports = 34 % du CO2.</li></ul>`]);
FICHES.V.push(["Travail et famille (livret 2026)", `<ul>
 <li>Règles du travail : Code du travail (35 h), conventions collectives, règlement intérieur (entreprises de 50 salariés et plus). Litiges : prud'hommes.</li>
 <li>Contrats : CDI (permanent), CDD (temporaire), intérim. France Travail ; Mission locale pour les moins de 25 ans ; allocation : <b>ARE</b>.</li>
 <li>Créer une entreprise : ouvert à tous, sans condition de nationalité. Aides : CMA, CCI.</li>
 <li>Fonction publique : d'État, territoriale, hospitalière ; concours ; Européens admis sauf emplois de souveraineté.</li>
 <li>Mariage civil en mairie ; livret de famille. 16 ans seulement avec dispense du procureur et accord des parents. Divorce par consentement mutuel : devant <b>notaire</b>.</li>
 <li>Naissance déclarée dans les <b>5 jours</b>. Congé paternité 28 jours ; congé supplémentaire de naissance (1 ou 2 mois) pour les enfants nés depuis 2026.</li>
 <li>Convention des droits de l'enfant (<b>1989</b>, UNICEF). Châtiments corporels et excision interdits. On ne peut pas déshériter totalement ses enfants.</li>
 <li>Instruction obligatoire de <b>3 à 16 ans</b> ; inscription à la mairie ; collège 4 ans, lycée 3 ans. Majorité numérique : 15 ans.</li>
 <li><b>Numéros :</b> 15, 17, 18, 112, 114 (SMS), 115, 119, 196 (mer), 3919, 3018, 3114, 116 000, 197 (attentat), 3117.</li></ul>`]);

<script>
const THEMES = {
  P:{name:"Principes et valeurs de la République", short:"Valeurs", exam:{k:5,s:6}},
  I:{name:"Système institutionnel et politique", short:"Institutions", exam:{k:6,s:0}},
  D:{name:"Droits et devoirs", short:"Droits", exam:{k:5,s:6}},
  H:{name:"Histoire, géographie et culture", short:"Histoire", exam:{k:8,s:0}},
  V:{name:"Vivre dans la société française", short:"Société", exam:{k:4,s:0}}
};
const TK = Object.keys(THEMES);
// unified bank: id "n" for official, "S1" for situations
const BANK = {};
Q.forEach(([n,t,q,a,e])=>BANK[String(n)]={id:String(n),num:n,t,q,a,e,sit:false});
S.forEach(([id,t,q,a,e,src])=>BANK[id]={id,num:id,t,q,a,e,sit:true,src:src||""});
X.forEach(([id,t,q,a,e,src])=>BANK[id]={id,num:id,t,q,a,e,sit:false,extra:true,src:src||""});
// rewritten options (similar length, plausible wrong answers)
Object.entries(OVR).forEach(([id,[a,pre]])=>{const q=BANK[id]; if(!q) return; q.a=a; if(pre) q.e=pre+q.e;});
Object.entries(VAROVR).forEach(([n,alts])=>{ if(VAR[n]&&alts.length===VAR[n].length) VAR[n]=alts; });
// variants: same official question, another correct answer
Object.entries(VAR).forEach(([n,alts])=>{
  const b=BANK[n]; if(!b) return;
  const all=[b.a[0],...alts], baseE=b.e, n_=all.length;
  const note=k=>" Autres bonnes réponses possibles : "+all.filter((_,j)=>j!==k).join(" ; ")+".";
  Object.assign(b,{group:n,nvar:n_,vk:1,e:baseE+note(0)});
  alts.forEach((alt,k)=>{const id=n+"v"+(k+2); BANK[id]=Object.assign({},b,{id,a:[alt,...b.a.slice(1)],vk:k+2,e:baseE+note(k+1)});});
});
const NVAR=Object.values(BANK).filter(q=>q.vk>1).length;
// regions: fill missing explanations, mark region questions, add the review table
const REG_BY={}; REGIONS.forEach(([r,c,o])=>{REG_BY[r]=[r,c,o]; REG_BY["La "+r]=[r,c,o]; REG_BY[c]=[r,c,o]});
Object.values(BANK).forEach(q=>{ if(/^R\d+$/.test(q.id)) REGION_IDS.add(q.id);
  if(REGION_IDS.has(q.id)&&!q.e){ const m=REG_BY[q.a[0]]; q.e=m?`${m[0]} : chef-lieu ${m[1]}${m[2]?" ; autres grandes villes : "+m[2]:""}.`:""; } });
FICHES.H.push(["Les 18 régions et leurs chefs-lieux", `<div class="tablebox"><table class="chrono">${REGIONS.map(([r,c,o])=>`<tr><td>${c}</td><td><b>${r}</b><br><span class="note">${o}</span></td></tr>`).join("")}</table></div><p class="note">13 régions en métropole (depuis 2016) et 5 en outre-mer. Pièges fréquents : Nantes est en Pays de la Loire, pas en Bretagne ; Rouen (et non Caen) est le chef-lieu de la Normandie ; Pointe-à-Pitre n'est pas le chef-lieu de la Guadeloupe.</p>`]);
const variantsOf=n=>Object.values(BANK).filter(q=>q.group===n);
const OFFICIAL_IDS = Q.map(x=>String(x[0]));

/* ---------- state & persistence ---------- */
const LS_KEY="civique.progress.v1", LS_EXAM="civique.exam.v1";
let state = {stats:{}, exams:[], read:{}, cards:{}, games:{}, updated:0};
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
const local = lsGet(LS_KEY); if(local && local.stats) state = Object.assign(state, local);

let docRef=null, syncMsg="Progression enregistrée sur cet appareil", writing=false, pending=false, saveTimer=null;
function save(){
  state.updated=Date.now(); lsSet(LS_KEY,state);
  if(!docRef) return;
  clearTimeout(saveTimer); saveTimer=setTimeout(flush,1200);
}
async function flush(){
  if(!docRef) return;
  if(writing){pending=true;return}
  writing=true;
  try{ await docRef.set(JSON.parse(JSON.stringify(state))); syncMsg="Progression synchronisée avec votre compte"; }
  catch(e){ syncMsg="Synchronisation impossible, progression gardée sur cet appareil"; }
  writing=false; updateSync();
  if(pending){pending=false;flush()}
}
function updateSync(){document.querySelectorAll(".syncline").forEach(el=>el.textContent=syncMsg)}
(async()=>{
  try{
    if(!window.claude||!claude.use) return;
    const [db,user] = await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user) return;
    const id = await user.id(); if(!id) return;
    docRef = db.doc("data/users/"+id+"/progress");
    const snap = await docRef.get();
    if(snap.exists){
      const remote = snap.data();
      if((remote.updated||0) > (state.updated||0)){ state = Object.assign({stats:{},exams:[],read:{},cards:{}}, JSON.parse(JSON.stringify(remote))); lsSet(LS_KEY,state); }
      else if((state.updated||0) > (remote.updated||0)){ flush(); }
    } else if(state.updated){ flush(); }
    syncMsg="Progression synchronisée avec votre compte"; render();
  }catch(e){ syncMsg="Progression enregistrée sur cet appareil"; updateSync(); }
})();

function record(id, correct){
  const s = state.stats[id] || {c:0,w:0,s:0,t:0};
  if(correct){s.c++; s.s=Math.max(0,s.s)+1}else{s.w++; s.s=0}
  s.t=Date.now(); state.stats[id]=s;
}
function status(id){ // u unseen, w wrong last, l learning, m mastered
  const s=state.stats[id]; if(!s) return "u";
  if(s.s>=2) return "m"; if(s.s===0) return "w"; return "l";
}
function themeStats(t){
  const ids = Object.values(BANK).filter(q=>q.t===t).map(q=>q.id);
  let m=0,l=0,w=0; ids.forEach(id=>{const st=status(id); if(st==="m")m++; else if(st==="l")l++; else if(st==="w")w++;});
  return {n:ids.length,m,l,w};
}
function readiness(){
  const ids=Object.keys(BANK); let sc=0;
  ids.forEach(id=>{const s=status(id); sc+= s==="m"?1 : s==="l"?0.5 : 0});
  return Math.round(100*sc/ids.length);
}

/* ---------- helpers ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(arr,n,weightFn){ // weighted sample without replacement
  const pool=arr.map(x=>({x,w:weightFn?weightFn(x):1})); const out=[];
  while(out.length<n && pool.length){const tot=pool.reduce((s,p)=>s+p.w,0);let r=Math.random()*tot,i=0;for(;i<pool.length;i++){r-=pool[i].w;if(r<=0)break}out.push(pool.splice(Math.min(i,pool.length-1),1)[0].x)}
  return out;
}
const label = q=> q.sit ? "Mise en situation" : q.extra ? "Complément hors liste" : "Q "+String(q.num).padStart(3,"0")+" / 258"+(q.nvar?` · variante ${q.vk}/${q.nvar}`:"");
const SRC={c:"Signalé par un candidat",p:"Exemple d'un site de préparation",o:"Liste officielle CSP/CR",t:"Piège fréquent",l:"Livret du citoyen 2026"};
const fmtDate = t=> new Date(t).toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
const L="ABCD";

/* ---------- routing ---------- */
const VIEWS = {accueil:vHome, examen:vExam, entrainement:vTrain, fiches:vFiches, entretien:vEntretien, progres:vProgress, frise:vFrise, carte:vCarte, marseillaise:vMars};
function route(){ return (location.hash||"#accueil").slice(1) in VIEWS ? (location.hash||"#accueil").slice(1) : "accueil"; }
function render(){
  const r=route();
  const nr=["frise","carte","marseillaise"].includes(r)?"fiches":r;
  document.querySelectorAll("nav.tabs a, nav.tabbar a").forEach(a=>{ if(a.getAttribute("href")==="#"+nr) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  VIEWS[r]();
}
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});

/* ---------- HOME ---------- */

  $("#view").innerHTML = `<div class="stack" style="gap:28px">

    <span class="eyebrow">Examen civique · mention naturalisation</span>
    <p class="note" lang="uk">Утримуйте палець на будь-якому слові (або клацніть правою кнопкою), щоб побачити переклад українською.</p>
    <h1>Préparez les 40 questions du jour J</h1>
    <p class="lead">Les 258 questions de connaissance de la liste officielle, ${NVAR} variantes avec d'autres bonnes réponses, ${S.length} mises en situation, ${X.length} compléments (retours de candidats, listes officielles CSP/CR), des fiches de révision, ${ENT.length} cartes pour préparer l'entretien d'assimilation et un suivi de votre progression.</p>
   </div>

    <div><b>40</b><span>questions, une bonne réponse sur 4</span></div>
    <div><b>28 + 12</b><span>connaissances + mises en situation</span></div>

       : `<p class="note">Aucun examen passé pour l'instant.</p>`}
      ${weakest && seen? `<p>Thème à travailler en priorité : <b>${THEMES[weakest.t].name}</b>.</p>
      <div class="row"><a class="btn ghost small" href="#entrainement" data-theme="${weakest.t}" id="goWeak" style="text-decoration:none">S'entraîner sur ce thème</a></div>`:""}
    </div>
   </div>
   <div class="panel stack">
    <h3>Trois façons de réviser autrement</h3>
    <div class="modecards">

   <div class="panel stack">
    <h3>Ce que rapportent les candidats</h3>

     <li>Méthode pour les situations : écartez les réponses qui ignorent le problème ou font justice soi-même, puis choisissez l'institution compétente (mairie, police, Défenseur des droits, prud'hommes).</li>

    ${themeBars()}

   </div>
   <p class="note">Questions : liste officielle du ministère de l'Intérieur. Réponses vérifiées par comparaison avec les <a href="https://leqcmcivique.fr" target="_blank" rel="noopener">réponses suggérées par leqcmcivique.fr</a> (Licence Ouverte 2.0). Ces réponses n'engagent pas l'État.</p>

  const gw=$("#goWeak"); if(gw) gw.onclick=()=>{trainCfg.themes=new Set([gw.dataset.theme])};
  $("#goRep").onclick=()=>{trainCfg={themes:new Set(TK),mode:"all",n:999,kind:"reported"};train=null;location.hash="#entrainement"};
}
function themeBars(){
  return `<div class="themebars">${TK.map(t=>{const s=themeStats(t);return `<div class="tb"><span>${THEMES[t].name}</span>
   <span class="bar" title="${s.m} maîtrisées, ${s.l} en cours"><i class="m" style="width:${100*s.m/s.n}%"></i><i class="l" style="width:${100*s.l/s.n}%"></i></span>
   <span class="num" style="text-align:right">${s.m}/${s.n}</span></div>`}).join("")}</div>
   <div class="legend"><span><i style="background:var(--ok)"></i>maîtrisée (2 bonnes réponses d'affilée)</span><span><i style="background:var(--warn)"></i>en cours</span></div>`;
}

/* ---------- EXAM ---------- */
let exam = lsGet(LS_EXAM);
function buildExam(){
  const items=[];
  TK.forEach(t=>{
    const cfg=THEMES[t].exam;
    const kn=Object.values(BANK).filter(q=>q.t===t&&!q.sit&&!q.extra&&!(q.vk>1));
    const si=Object.values(BANK).filter(q=>q.t===t&&q.sit);
    // favour questions not yet mastered
    const w=q=>({u:3,w:4,l:2,m:1})[status(q.id)];
    const gw=q=>q.group? Math.max(...variantsOf(q.group).map(w)) : w(q);
    pick(kn,cfg.k,gw).forEach(q=>items.push(q.group? pick(variantsOf(q.group),1,w)[0].id : q.id));
    pick(si,cfg.s,w).forEach(q=>items.push(q.id));
  });
  const ids=shuffle(items);
  return {ids, order:ids.map(()=>shuffle([0,1,2,3])), ans:ids.map(()=>null), cur:0, start:Date.now(), done:false};
}
let tick=null;
function vExam(){
  clearInterval(tick);
  if(!exam){
    $("#view").innerHTML=`<div class="stack" style="gap:24px">
     <div class="stack"><span class="eyebrow">Examen blanc</span><h1>Conditions du jour J</h1>
     <p class="lead">40 questions tirées selon la répartition de l'arrêté du 10 octobre 2025 : 11 sur les valeurs (dont 6 mises en situation), 6 sur les institutions, 11 sur les droits et devoirs (dont 6 mises en situation), 8 sur l'histoire et la géographie, 4 sur la vie en société. Correction à la fin uniquement.</p></div>
     <div class="panel">${examTable()}</div>
     <div class="row"><button class="btn" id="startEx">Commencer (45 min)</button></div>
     <p class="note">Les questions que vous ne maîtrisez pas encore sortent plus souvent. Une réponse fausse ou absente vaut 0, sans pénalité.</p></div>`;
    $("#startEx").onclick=()=>{exam=buildExam();lsSet(LS_EXAM,exam);window.scrollTo({top:0});vExam()};
    return;
  }
  if(exam.done){ return vResult(); }
  drawExam();
  tick=setInterval(()=>{const el=$("#timer"); if(!el){clearInterval(tick);return} const left=remaining(); el.textContent=mmss(left); el.classList.toggle("low",left<300); if(left<=0){finishExam()}},1000);
}
function examTable(){
  return `<div class="tablebox"><table class="sum"><tr><th>Thème</th><th class="r" title="Questions de connaissances">Connais.</th><th class="r" title="Mises en situation">Situations</th><th class="r">Total</th></tr>
  ${TK.map(t=>{const c=THEMES[t].exam;return `<tr><td>${THEMES[t].name}</td><td class="r">${c.k}</td><td class="r">${c.s}</td><td class="r">${c.k+c.s}</td></tr>`}).join("")}
  <tr><td><b>Total</b></td><td class="r"><b>28</b></td><td class="r"><b>12</b></td><td class="r"><b>40</b></td></tr></table></div><p class="note">Connais. : questions de connaissances, tirées de la liste officielle. Situations : mises en situation.</p>`;
}
const remaining=()=>Math.max(0,45*60-Math.floor((Date.now()-exam.start)/1000));
const mmss=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function drawExam(){
  const i=exam.cur, q=BANK[exam.ids[i]], ord=exam.order[i], answered=exam.ans.filter(a=>a!==null).length;
  $("#view").innerHTML=`<div class="stack">
   <div class="examhead"><div><span class="eyebrow">Examen blanc · question ${i+1} sur 40</span><div class="note">${answered} réponse${answered>1?"s":""} sur 40</div></div>
   <div id="timer" class="timer num">${mmss(remaining())}</div></div>
   <div class="qnav" aria-label="Aller à la question">${exam.ids.map((id,k)=>`<button data-k="${k}" class="${exam.ans[k]!==null?"ans":""} ${k===i?"cur":""}" aria-label="Question ${k+1}">${k+1}</button>`).join("")}</div>
   ${qCard(q, ord, exam.ans[i], null)}
   <div class="row" style="justify-content:space-between">
    <div class="row"><button class="btn ghost small" id="prev" ${i===0?"disabled":""}>Précédente</button>
    <button class="btn ghost small" id="next" ${i===39?"disabled":""}>Suivante</button></div>
    <button class="btn small" id="finish">Terminer l'examen</button></div>
   <div id="confirm"></div></div>`;
  document.querySelectorAll(".qnav button").forEach(b=>b.onclick=()=>{exam.cur=+b.dataset.k;lsSet(LS_EXAM,exam);drawExam();window.scrollTo({top:0})});
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{exam.ans[i]=+b.dataset.o;lsSet(LS_EXAM,exam); if(i<39){exam.cur=i+1} drawExam(); window.scrollTo({top:0})});
  $("#prev").onclick=()=>{exam.cur--;drawExam()}; $("#next").onclick=()=>{exam.cur++;drawExam()};
  const nav=document.querySelector(".qnav"), cb=nav&&nav.querySelector(".cur");
  if(nav&&cb&&nav.scrollWidth>nav.clientWidth) nav.scrollLeft=cb.offsetLeft-nav.offsetLeft-(nav.clientWidth-cb.offsetWidth)/2;
  $("#finish").onclick=()=>{
    const left=40-exam.ans.filter(a=>a!==null).length;
    $("#confirm").innerHTML=`<div class="panel row" style="justify-content:space-between"><span>${left?`Il reste ${left} question${left>1?"s":""} sans réponse.`:"Toutes les questions ont une réponse."} Terminer maintenant ?</span>
     <div class="row"><button class="btn ghost small" id="cancel">Continuer</button><button class="btn small" id="ok">Voir mon résultat</button></div></div>`;
    $("#cancel").onclick=()=>$("#confirm").innerHTML=""; $("#ok").onclick=finishExam;
  };
}
// a = original index chosen (0 = correct). reveal: show correct/incorrect
function qCard(q, ord, chosen, reveal){
  return `<div class="qcard"><div class="qmeta"><span class="row" style="gap:6px"><span class="tag ${q.sit?"sit":q.extra?"ext":""}">${label(q)}</span>${q.src?`<span class="tag ${q.src==="t"?"trap":"src"}">${SRC[q.src]}</span>`:""}</span><span class="tag">${THEMES[q.t].short}</span></div>
   <p class="qtext">${esc(q.q)}</p>
   <div class="opts">${ord.map((o,k)=>{let c="";
     if(reveal){ if(o===0)c="good"; else if(o===chosen)c="bad"; }
     else if(o===chosen) c="sel";
     return `<button class="opt ${c}" data-o="${o}" ${reveal?"disabled":""}><span class="k">${L[k]}</span><span>${esc(q.a[o])}</span></button>`}).join("")}</div>
   ${reveal?`<div class="expl"><b>${chosen===0?"Bonne réponse.":chosen==null?"Sans réponse.":"Réponse attendue : "+esc(q.a[0])+"."}</b> ${esc(q.e)}</div>`:""}</div>`;
}
function finishExam(){
  clearInterval(tick);
  let score=0; const by={}; TK.forEach(t=>by[t]=[0,0]); let sit=[0,0];
  exam.ids.forEach((id,k)=>{const q=BANK[id], ok=exam.ans[k]===0; if(ok)score++; by[q.t][1]++; if(ok)by[q.t][0]++; if(q.sit){sit[1]++; if(ok)sit[0]++} record(id,ok)});
  exam.done=true; exam.score=score; exam.dur=Math.min(45*60,Math.floor((Date.now()-exam.start)/1000)); exam.reviewIdx=null;
  state.exams.push({date:Date.now(),score,dur:exam.dur,by,sit});
  if(state.exams.length>200) state.exams=state.exams.slice(-200);
  save(); lsSet(LS_EXAM,exam); vResult();
}
let resultFilter="bad";
function vResult(){
  const ok=exam.score>=32, last=state.exams.slice(-1)[0];
  const rows=exam.ids.map((id,k)=>({id,k,ok:exam.ans[k]===0}));
  const shown=rows.filter(r=>resultFilter==="all"||!r.ok);
  $("#view").innerHTML=`<div class="stack" style="gap:24px">
   <div class="attest stack">
    <div class="seal ${ok?"ok":"ko"}">${ok?"RÉUSSI":"À<br>RETRAVAILLER"}</div>

/* ---------- TRAINING ---------- */
let trainCfg={themes:new Set(TK), mode:"smart", n:20, kind:"all"};
let train=null;
function pool(){
  return Object.values(BANK).filter(q=>trainCfg.themes.has(q.t) && (trainCfg.kind==="all" || (trainCfg.kind==="sit"&&q.sit) || (trainCfg.kind==="know"&&!q.sit&&!q.extra) || (trainCfg.kind==="extra"&&q.extra) || (trainCfg.kind==="reported"&&(q.src==="c"||q.src==="p")) || (trainCfg.kind==="variants"&&!!q.nvar) || (trainCfg.kind==="official2"&&q.src==="o") || (trainCfg.kind==="traps"&&q.src==="t") || (trainCfg.kind==="regions"&&REGION_IDS.has(q.id)) || (trainCfg.kind==="livret"&&/^L\d/.test(q.id)))).filter(q=>{
    const st=status(q.id);
    if(trainCfg.mode==="mistakes") return st==="w";
    if(trainCfg.mode==="new") return st==="u";
    if(trainCfg.mode==="notm") return st!=="m";
    return true;
  });
}
function vTrain(){
  if(train && !train.finished) return drawTrain();
  const p=pool();
  const seg=(key,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button data-k="${key}" data-v="${v}" aria-pressed="${String(trainCfg[key])===String(v)}">${l}</button>`).join("")}</div>`;

   <div class="panel stack">

    <h3>Questions</h3>
    ${seg("mode",[["smart","Priorité aux points faibles"],["notm","Non maîtrisées"],["new","Jamais vues"],["mistakes","Mes erreurs"],["all","Toutes, au hasard"]])}
    <h3>Type</h3>
    ${seg("kind",[["all","Toutes"],["know","Liste officielle"],["sit","Mises en situation"],["extra","Compléments"],["reported","Issues des retours"],["official2","Listes CSP/CR"],["traps","Pièges"],["regions","Régions"],["livret","Livret 2026"],["variants","Avec variantes"]])}
    <h3>Nombre</h3>
    ${seg("n",[[10,"10"],[20,"20"],[50,"50"],[999,"Toutes"]])}
    <div class="row" style="justify-content:space-between"><span class="note">${p.length} question${p.length>1?"s":""} disponible${p.length>1?"s":""} avec ces réglages</span>
    <button class="btn" id="go" ${p.length?"":"disabled"}>Commencer</button></div>
   </div></div>`;
  document.querySelectorAll("#themes button").forEach(b=>b.onclick=()=>{const t=b.dataset.t; if(trainCfg.themes.has(t)&&trainCfg.themes.size>1)trainCfg.themes.delete(t); else trainCfg.themes.add(t); vTrain()});
  document.querySelectorAll(".seg button[data-k]").forEach(b=>b.onclick=()=>{const k=b.dataset.k; trainCfg[k]= k==="n"? +b.dataset.v : b.dataset.v; vTrain()});
  $("#go").onclick=()=>{
    const p=pool(); const n=Math.min(trainCfg.n,p.length);
    const w=trainCfg.mode==="smart"? (q=>({u:3,w:5,l:2,m:0.5})[status(q.id)]) : null;
    const ids=(w?pick(p,n,w):shuffle(p).slice(0,n)).map(q=>q.id);
    train={ids, order:ids.map(()=>shuffle([0,1,2,3])), i:0, chosen:null, good:0, finished:false};
    drawTrain();
  };
}
function drawTrain(){
  const q=BANK[train.ids[train.i]], st=state.stats[q.id];
  $("#view").innerHTML=`<div class="stack">
   <div class="row" style="justify-content:space-between"><span class="eyebrow">Entraînement · ${train.i+1} / ${train.ids.length}</span>
   <span class="note num">${train.good} bonne${train.good>1?"s":""} réponse${train.good>1?"s":""}</span></div>
   ${qCard(q,train.order[train.i],train.chosen,train.chosen!==null)}
   ${st&&train.chosen===null?`<p class="note">Déjà vue : ${st.c} bonne${st.c>1?"s":""}, ${st.w} erreur${st.w>1?"s":""}.</p>`:""}
   <div class="row" style="justify-content:space-between"><button class="btn ghost small" id="stop">Arrêter</button>
   ${train.chosen!==null?`<button class="btn" id="nxt">${train.i+1<train.ids.length?"Question suivante":"Voir le bilan"}</button>`:""}</div></div>`;
  if(train.chosen===null) document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{train.chosen=+b.dataset.o; const ok=train.chosen===0; if(ok)train.good++; record(q.id,ok); save(); drawTrain(); const n=$("#nxt"); if(n)n.focus()});
  $("#stop").onclick=()=>{train.finished=true; trainDone()};
  const n=$("#nxt"); if(n) n.onclick=()=>{ if(train.i+1<train.ids.length){train.i++;train.chosen=null;drawTrain();window.scrollTo(0,0)} else {train.finished=true;trainDone()} };

function trainDone(){
  const done=train.i+(train.chosen!==null?1:0);

const TL_ALL = TIMELINE.flatMap(([per,evs])=>evs.map(e=>({y:e[0],d:e[1],t:e[2],x:e[3],per})));
let friseTab="frise", friseOpen=null, fq=null;
function vFrise(){

     <p>${fq.checked?`<b>${fq.score}/${fq.items.length}</b> à la bonne place.`:`Touchez les événements <b>du plus ancien au plus récent</b>. Touchez à nouveau pour annuler.`}</p>

        return `<li><button class="ord ${pos>=0?"sel":""}" data-i="${i}"><span class="ordn">${pos>=0?pos+1:""}</span><span>${esc(e.t)}</span></button></li>`}).join("")}</ol>
     <div class="row">${fq.checked?`<button class="btn" id="fnew">Nouvelle série</button>`:`<button class="btn" id="fchk" ${done?"":"disabled"}>Vérifier</button><button class="btn ghost" id="freset">Effacer</button>`}</div>
     <p class="note">Séries jouées : ${g.frise.plays} · sans faute : ${g.frise.perfect}</p></div></div>`;
    document.querySelectorAll(".ord[data-i]").forEach(b=>b.onclick=()=>{const i=+b.dataset.i,p=fq.pick.indexOf(i); if(p>=0) fq.pick.splice(p,1); else fq.pick.push(i); vFrise()});

      g.frise.plays++; if(fq.score===fq.items.length) g.frise.perfect++; g.frise.best=Math.max(g.frise.best,fq.score); save(); vFrise()};
    const r=$("#freset"); if(r) r.onclick=()=>{fq.pick=[];vFrise()};
    const n=$("#fnew"); if(n) n.onclick=()=>{newFq(fq.level);vFrise()};
    document.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{newFq(b.dataset.lv);vFrise()});
  }
  document.querySelectorAll("[data-ft]").forEach(b=>b.onclick=()=>{friseTab=b.dataset.ft;vFrise()});
}
function newFq(level){
  const pool=level==="xx"?TL_ALL.filter(e=>e.y>=1900):TL_ALL, gap=level==="xx"?3:40;
  let items=[];
  for(let tries=0;tries<200&&items.length<5;tries++){ items=[]; for(const e of shuffle(pool)){ if(items.every(x=>Math.abs(x.y-e.y)>=gap)) items.push(e); if(items.length===5) break; } }
  fq={level,items,pick:[],checked:false};
}

function mapSvg(cls){
  const [x,y,w,h]=FR_MAP.viewBox.split(" ").map(Number), oy=y+h+8, bw=(w-4*8)/5;
  const metro=FR_MAP.regions.map(r=>`<path class="rg ${cls(r.name)}" data-r="${esc(r.name)}" d="${r.d}"><title>${carteTab==="explore"?esc(r.name):""}</title></path>`).join("");

function newMq(){
  const names=Object.keys(REG), qs=[];
  // weight toward regions answered wrong before
  const g=G(), weight=n=>{const s=g.carte[n]; return s? 1+Math.max(0,s.w-s.c)*2 : 2};
  const bag=names.flatMap(n=>Array(weight(n)).fill(n));
  while(qs.length<10){
    const n=bag[Math.floor(Math.random()*bag.length)], R=REG[n];
    const kind=Math.random(); let q;
    if(kind<0.4) q={r:n,text:`Touchez : <b>${esc(n)}</b>`};
    else if(kind<0.7) q={r:n,text:`Où se trouve <b>${esc(R.cap)}</b>, chef-lieu de région ?`};
    else {const c=R.cities[Math.floor(Math.random()*R.cities.length)]; q={r:n,text:`Dans quelle région se trouve <b>${esc(c)}</b> ?`};}
    if(!qs.some(x=>x.text===q.text)) qs.push(q);
  }
  mq={qs,i:0,score:0,answered:null};
}

async function trOnline(text){
  const key=text.toLowerCase().slice(0,300); if(trCache[key]) return {t:trCache[key],src:"збережено"};
  const keep=t=>{trCache[key]=t; const ks=Object.keys(trCache); if(ks.length>1500) delete trCache[ks[0]]; lsSet(TR_KEY,trCache)};
  try{ if(window.claude&&claude.use){ const s=await claude.use("sample"); if(s){ const r=await s("Traduis ce texte français en ukrainien. Réponds uniquement par la traduction, sans guillemets ni commentaire. Si c'est un seul mot, donne la traduction la plus courante dans le contexte de la vie civique en France.\n\n"+text,{modelTier:"quick"}); const t=(r&&r.text||"").trim(); if(t){keep(t);return {t,src:"Claude"}} } } }catch(e){}
  try{ const r=await fetch("https://api.mymemory.translated.net/get?langpair=fr%7Cuk&q="+encodeURIComponent(text)); const j=await r.json(); const t=j&&j.responseData&&j.responseData.translatedText; if(t&&+j.responseStatus===200&&!/MYMEMORY WARNING/i.test(t)){keep(t);return {t,src:"MyMemory"}} }catch(e){}
  return null;
}
function wordAt(x,y){
  const el=document.elementFromPoint(x,y); if(!el||!el.closest("main")||el.closest(".trpop")) return null;
  const host=el.closest(".qtext,.opt,.expl,.fq,.fa,p,li,td,th,summary,h1,h2,h3,.note,.tag,span,b,div")||el;
  const walker=document.createTreeWalker(host,NodeFilter.SHOW_TEXT); let n; const re=/[\p{L}\p{M}'’-]+/gu;
  while((n=walker.nextNode())){ re.lastIndex=0; let m; while((m=re.exec(n.data))){ const r=document.createRange(); r.setStart(n,m.index); r.setEnd(n,m.index+m[0].length);
    for(const rc of r.getClientRects()){ if(x>=rc.left-3&&x<=rc.right+3&&y>=rc.top-3&&y<=rc.bottom+3){ const word=m[0].replace(/^[-'’]+|[-'’]+$/g,""); return word.length>1?{word,range:r,el:host}:null } } } }
  return null;
}

(function(){
  let lp=null, fired=false;
  document.addEventListener("touchstart",e=>{ if(e.touches.length!==1){if(lp)clearTimeout(lp.t);lp=null;return} const t=e.touches[0],x=t.clientX,y=t.clientY;
    if(lp) clearTimeout(lp.t); lp={x,y,t:setTimeout(()=>{ const w=wordAt(x,y); if(w){fired=true; if(navigator.vibrate) try{navigator.vibrate(10)}catch(_){}; showTr(w)} lp=null },480)} },{passive:true});
  document.addEventListener("touchmove",e=>{ if(!lp) return; const t=e.touches[0]; if(Math.hypot(t.clientX-lp.x,t.clientY-lp.y)>10){clearTimeout(lp.t);lp=null} },{passive:true});

function importProgress(txt){

  if(!inc||typeof inc!=="object"||!inc.stats) return "Ce code n'est pas une sauvegarde de cette application.";
  const out={stats:Object.assign({},state.stats),exams:[...(state.exams||[])],read:Object.assign({},state.read||{},inc.read||{}),cards:Object.assign({},state.cards||{},inc.cards||{}),games:mergeGames(state.games,inc.games),updated:0};
  let n=0; Object.entries(inc.stats).forEach(([id,s])=>{ const cur=out.stats[id]; if(!cur||((s.c+s.w)>(cur.c+cur.w))||((s.c+s.w)===(cur.c+cur.w)&&s.t>cur.t)){out.stats[id]=s;n++} });
  const seen=new Set(out.exams.map(e=>e.date)); (inc.exams||[]).forEach(e=>{ if(!seen.has(e.date)){out.exams.push(e);seen.add(e.date)} });
  out.exams.sort((a,b)=>a.date-b.date); state=out; save();

function chart(ex){
  const W=640,H=240,pl=40,pr=16,pt=16,pb=34, iw=W-pl-pr, ih=H-pt-pb;

  const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area= pts.length>1? path+` L${pts[pts.length-1][0]} ${y(0)} L${pts[0][0]} ${y(0)} Z`:"";
  const grid=[0,10,20,30,40].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${v}</text>`).join("");
  const step=Math.ceil(ex.length/8);
  const xl=ex.map((e,i)=> i%step===0||i===ex.length-1? `<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${fmtDate(e.date)}</text>`:"").join("");
  const last=pts[pts.length-1], lastS=ex[ex.length-1].score;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Scores des examens blancs">
   ${grid}
   <line x1="${pl}" x2="${W-pr}" y1="${y(32)}" y2="${y(32)}" stroke="var(--rouge)" stroke-width="1.5" stroke-dasharray="5 4"/>
   <text x="${W-pr}" y="${y(32)-6}" text-anchor="end" font-size="11" fill="var(--rouge)" font-family="IBM Plex Mono, monospace">seuil 32</text>
   ${area?`<path d="${area}" fill="var(--bleu)" fill-opacity=".08"/>`:""}
   <path d="${path}" fill="none" stroke="var(--bleu)" stroke-width="2"/>
   ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?5:3}" fill="${ex[i].score>=32?"var(--ok)":"var(--rouge)"}"/>`).join("")}
   <text x="${Math.min(last[0]+8,W-pr-20)}" y="${last[1]-8}" font-size="12" font-weight="600" fill="var(--fg)" font-family="IBM Plex Mono, monospace">${lastS}</text>
   ${xl}</svg>`;
}

// header height for sticky elements below it
function setHdr(){const hd=document.querySelector("header.top"); if(hd) document.documentElement.style.setProperty("--hdr",hd.offsetHeight+"px")}
setHdr(); window.addEventListener("resize",setHdr);
render();
</script>

<script>
// ?reset clears the offline cache and reloads a fresh copy
if(new URLSearchParams(location.search).has("reset")){
  (async()=>{try{const rs=await navigator.serviceWorker?.getRegistrations?.()||[];await Promise.all(rs.map(r=>r.unregister()));const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}catch(e){}location.replace(location.pathname)})();
} else if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{}));
}
</script>
</body>
